# Scenario: eAPI / raw CLI.
#
# Configures ceos01 by sending EOS CLI commands, nested as a structure rather
# than a flat script, through function-eapi. This is the escape hatch for
# anything the modelled layers do not cover -- here a prefix-list, a BGP peer
# group, and a full EVPN overlay.
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone scenarios/eapi \
#     | kubectl apply -f -
#
# This is an ALTERNATIVE to the restconf and jsonrpc scenarios, not an
# addition: eoscommand-3 sets Loopback0 to 10.255.0.1/32, which contradicts
# what examples/eos/restconf/loopback0ip.yaml puts there. Pick one mechanism
# per device.
#
# Within the scenario, eoscommand-3 is a superset of eoscommand-2 -- both
# create the EVPN-OVERLAY-PEERS group under `router bgp 65001`. They do not
# contradict each other, but -2 is there to show the smaller shape, so drop it
# if you want the minimal set.
#
# See scenarios/restconf/kustomization.yaml for why `resources` reaches into
# examples/ and why the load-restrictor flag is required.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: netclab

resources:
  - ../namespace.yaml

  - ../../examples/eos/eapi/eoscommand-1.yaml
  - ../../examples/eos/eapi/eoscommand-2.yaml
  - ../../examples/eos/eapi/eoscommand-3.yaml
