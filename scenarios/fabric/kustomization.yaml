# Scenario: the AVD fabric, and a VLAN added by patching the model.
#
# The eos and mid scenarios configure one device at a time -- by hand at the eos
# layer, through an abstraction at the mid layer. This one configures a whole
# fabric from a single AVD `eos_designs` document: the Fabric XR renders a
# config for every device and pushes it over eAPI. Adding a VLAN is the patch
# below, and it lands on every switch that should have it. The same VLAN at the
# eos layer is a hand-written XR per device.
#
#   kubectl apply -k scenarios/fabric/prerequisites
#   kubectl apply -k scenarios/fabric
#
#   kubectl apply -k scenarios/fabric --dry-run=client -o yaml  # see the model
#   kubectl -n avd get fabric,cm -l avd.netclab.dev/device     # see the render
#
# Teardown is a plain delete -- the Namespace belongs to the prerequisites, so
# it is not in this overlay and cannot be swept up with the XRs:
#
#   kubectl delete -k scenarios/fabric
#
# This scenario needs NETWORK ACCESS when applied: the base is fetched from git.
# It also needs its own devices; see WITH_FABRIC in scripts/up.sh.
#
# --- Why the base is remote ----------------------------------------------
#
# The design is not copied here. `avd.netclab.dev/Fabric` is authored and
# released by function-avd, and a topology derived from an AVD model is only
# valid for the AVD version that derived it -- a version that lives in that
# repo. Copying the document would mean holding a snapshot that goes stale
# silently the day AVD moves. Pinning by tag means an AVD upgrade upstream
# changes nothing here until the ref below is deliberately moved.
#
# `examples/lab` already carries `spec.push` with its hosts and credentials
# secret, so this scenario adds only its own content: the VLAN.
#
# Keep the ref in step with AVD_REF in scripts/up.sh -- the topology that boots
# the devices is fetched from the same tag, and the device list in
# `spec.push.hosts` only matches while both come from one place. See
# docs/scenarios/fabric.md.
#
# --- The one thing to know before applying it -----------------------------
#
# The push REPLACES each device's running config. On these devices that also
# removes netclab-chart's RESTCONF bootstrap, since AVD renders no RESTCONF at
# all -- eAPI survives because the model configures it. Harmless as long as the
# fabric scenario keeps its own devices, which is why it does.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The devices live here too. function-avd builds each device's eAPI URL as
# `{hostname}.{namespace}.svc` from the XR's own namespace, so the Fabric cannot
# sit apart from the netclab-chart release that runs its switches. One topology
# per namespace is that chart's documented model. The Namespace object itself is
# a prerequisite, not part of this overlay, so teardown never removes it.
namespace: avd

resources:
  - github.com/netclab/function-avd/examples/lab?ref=v0.1.5

patches:
  - target:
      kind: Fabric
      name: single-dc-l3ls
    patch: |-
      # One SVI, added to a tenant VRF. AVD works out the rest: the VLAN, the
      # SVI on every leaf that carries VRF10, the VXLAN VNI, and the EVPN
      # route-target -- none of which is written here.
      - op: add
        path: /spec/design/tenants/0/vrfs/0/svis/-
        value:
          id: 13
          name: VRF10_VLAN13
          enabled: true
          ip_address_virtual: 10.10.13.1/24
