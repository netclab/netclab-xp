# The fabric scenario's own prerequisites, separate from
# `scenarios/prerequisites/` rather than an addition to it.
#
# The eos and mid scenarios share one set because they share a mechanism: XRs
# whose composed Requests fall back to a cluster-scoped ClusterProviderConfig,
# reading credentials from a Secret the compositions name statically in
# `crossplane-system`. The AVD push does neither -- it names a namespaced
# ProviderConfig and takes a pre-encoded token from a Secret beside the Fabric.
# Merging the two sets would mean one of them carrying objects the other's
# scenarios must not have.
#
#   kubectl apply -k scenarios/fabric/prerequisites
#
# Everything lives in the `avd` namespace, with the devices: function-avd
# derives each device URL from the XR's own namespace, so the Fabric, its
# credentials and the netclab-chart release have to agree on one. Change the
# namespace here, in namespace.yaml, in scenarios/fabric/kustomization.yaml and
# in AVD_NS in scripts/up.sh together.
#
# No `namespace:` transformer, for the same reason as the other prerequisites:
# these namespaces are load-bearing, not decoration.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - providerconfig.yaml
  - secret.yaml
