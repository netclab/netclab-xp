# eAPI credentials for the AVD push, in the format function-avd expects.
#
# Not interchangeable with `scenarios/prerequisites/secret.yaml`, despite both
# holding the same two words. That one lives in `crossplane-system` and its
# `basicAuth` key holds the raw `arista:arista`, which the go-templating
# compositions base64 themselves. This one lives beside the Fabric and its
# `basic` key holds the token already encoded, because push.py puts the value
# straight into an Authorization header.
#
# The name must match `spec.push.credentialsSecretName`.
#
# Nothing secret here: `arista:arista` is the stock cEOS lab login, the same
# one netclab-chart bootstraps. It also survives the first push, because the
# AVD model's sha512 for `arista` is the hash of that same password -- so the
# config that replaces the bootstrap keeps the credentials that delivered it.
apiVersion: v1
kind: Secret
metadata:
  name: eapi-creds
  namespace: avd
type: Opaque
stringData:
  basic: YXJpc3RhOmFyaXN0YQ==
