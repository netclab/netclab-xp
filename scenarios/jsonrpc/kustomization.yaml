# Scenario: JSON-RPC.
#
# Configures ceos01 through eAPI's JSON-RPC endpoint, for settings OpenConfig
# does not model: STP mode, internal VLAN allocation, BGP multipath, and
# exporting a loopback into BGP.
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone scenarios/jsonrpc \
#     | kubectl apply -f -
#
# NOTE -- unverified: this scenario looks like an *addition* to the RESTCONF
# one rather than an alternative to it. `bgpinterfaceexport` and `bgpmultipath`
# both carry `asn: 65001`, but nothing here creates `router bgp 65001`; that is
# examples/eos/restconf/bgpglobal.yaml. If that holds, applying this alone on a
# fresh device leaves those two XRs unable to converge, and the documented
# order is restconf first. Confirm on a live device before writing that down.
#
# See scenarios/restconf/kustomization.yaml for why `resources` reaches into
# examples/ and why the load-restrictor flag is required.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: netclab

resources:
  - ../namespace.yaml

  - ../../examples/eos/jsonrpc/stpdisabled.yaml
  - ../../examples/eos/jsonrpc/vlanInternalAllocation.yaml
  - ../../examples/eos/jsonrpc/bgpmultipath.yaml
  - ../../examples/eos/jsonrpc/bgpinterfaceexport.yaml
