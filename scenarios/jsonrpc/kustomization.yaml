# Scenario: JSON-RPC.
#
# Configures ceos01 through eAPI's JSON-RPC endpoint, for settings OpenConfig
# does not model: STP mode, internal VLAN allocation, BGP multipath, and
# exporting a loopback into BGP.
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone scenarios/jsonrpc \
#     | kubectl apply -f -
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone scenarios/jsonrpc \
#     | yq 'select(.kind != "Namespace")' \
#     | kubectl delete -f -
#
# Stands on its own -- verified on a live cEOS with nothing else applied. It is
# not a layer on the RESTCONF scenario, and neither is a prerequisite for the
# other.
#
# `bgpglobal` here owns `router bgp 65001`, so the scenario tears down without
# leaving the instance behind. It selects this layer's Composition of a kind the
# RESTCONF scenario also uses -- see examples/eos/jsonrpc/bgpglobal.yaml.
#
# See scenarios/restconf/kustomization.yaml for why `resources` reaches into
# examples/ and why the load-restrictor flag is required.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: netclab

resources:
  - ../namespace.yaml

  - ../../examples/eos/jsonrpc/bgpglobal.yaml
  - ../../examples/eos/jsonrpc/stpdisabled.yaml
  - ../../examples/eos/jsonrpc/vlanInternalAllocation.yaml
  - ../../examples/eos/jsonrpc/bgpmultipath.yaml
  - ../../examples/eos/jsonrpc/bgpinterfaceexport.yaml
