# Device credentials. The compositions read this Secret through their
# `credentials` block and base64 it into an `Authorization: Basic` header.
#
# The namespace is not arbitrary: the compositions name `crossplane-system`
# statically, so this Secret must live there whatever namespace the XRs use.
# That is also why no scenario applies a namespace transformer here.
#
# `YXJpc3RhOmFyaXN0YQ==` is `arista:arista`, the stock cEOS lab credentials --
# published deliberately, because this is what makes the package usable out of
# the box. Replace it for anything that is not a throwaway lab.
apiVersion: v1
kind: Secret
metadata:
  name: eos-creds
  namespace: crossplane-system
type: Opaque
data:
  basicAuth: YXJpc3RhOmFyaXN0YQ==
