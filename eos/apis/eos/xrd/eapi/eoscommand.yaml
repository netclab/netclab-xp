apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: eoscommands.eos.netclab.dev
spec:
  defaultCompositionRef:
    name: eoscommands.eos.netclab.dev
  scope: Namespaced
  group: eos.netclab.dev
  names:
    kind: EosCommand
    plural: eoscommands
    categories:
    - crossplane
    - netclab

  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    additionalPrinterColumns:
    - name: ENDPOINT
      type: string
      jsonPath: .spec.endpoint
    - name: SECTION_RM
      type: boolean
      jsonPath: .spec.removeSection

    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              endpoint:
                type: string
              # On remove, take out the enclosing config section rather than
              # just the setting nested in it -- `no router bgp 65001` instead
              # of entering that block and negating one line inside it. Only
              # has an effect for a nested `cmds` path; a single-line path is
              # already removed as itself.
              removeSection:
                type: boolean
                default: false
              cmds:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: object
                        additionalProperties:
                          type: object
                          properties: {}
            required:
            - endpoint
            - cmds
        required:
        - spec
