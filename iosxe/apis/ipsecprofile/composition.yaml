apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: ipsecprofiles.iosxe.netclab.dev
spec:
  compositeTypeRef:
    apiVersion: iosxe.netclab.dev/v1alpha1
    kind: IpsecProfile
  mode: Pipeline
  pipeline:
  # One Request owns the IPsec profile over RESTCONF. The router keeps the
  # transform-sets sorted by name whatever order a write sends, so they are a
  # set, sorted in the body too; a PATCH adds to them. The router refuses a
  # profile naming a missing transform-set or IKEv2 profile, and their delete
  # while it names them. What else the router holds in `set`, such as pfs, the
  # spec has no field for, so Replace takes it off.
  # Observe only reads; Merge PATCHes the fields of the spec;
  # Replace PUTs the profile and DELETEs it with the object. The status is
  # the last GET in the shape of the spec; Ready means the mode's write would
  # change nothing.
  # The Device comes first in `after`, as if the spec named it. Once every object
  # in `after` is Ready the Requests are composed, and they stay composed whatever
  # happens to those objects; until then none is, and the XR is not Ready, where
  # Crossplane would call an XR composing nothing Ready. A Usage of each object in
  # `after` holds back its delete until this XR is gone.
  - step: requests
    functionRef:
      name: crossplane-contrib-function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource }}
          {{- $ns := $xr.metadata.namespace }}
          {{- $after := default (list) $xr.spec.after }}
          {{- $observed := default (dict) .observed.resources }}
          {{- $policy := $xr.spec.managementPolicy | default "Observe" }}
          {{- $old := default (dict) $xr.status }}

          {{- /* ---- its name: under another name the object composes nothing ---- */}}
          {{- /* <device>--<slug>--<8 hex>, at most 63 characters */}}
          {{- $device := $xr.spec.deviceRef.name }}
          {{- $after = prepend $after (dict "kind" "Device" "name" $device) }}
          {{- $slug := regexReplaceAll "[^a-z0-9]+" (lower $xr.spec.name) "-" | trimAll "-" }}
          {{- $slug = trunc (int (max 0 (sub 51 (len $device)))) $slug | trimSuffix "-" }}
          {{- $want := printf "%s--%s--%s" $device $slug (sha256sum $xr.spec.name | trunc 8) }}
          {{- if ne $xr.metadata.name $want }}
          ---
          apiVersion: {{ $xr.apiVersion }}
          kind: {{ $xr.kind }}
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/ready: "False"
          status:
            wantsName: {{ $want }}
          {{- else }}

          {{- /* ---- what it requires ---- */}}
          ---
          apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
          kind: ExtraResources
          requirements:
            device:
              apiVersion: iosxe.netclab.dev/v1alpha1
              kind: Device
              matchName: {{ $device }}
              namespace: {{ $ns }}
            {{- range $i, $a := $after }}
            after-{{ $i }}:
              apiVersion: iosxe.netclab.dev/v1alpha1
              kind: {{ $a.kind }}
              matchName: {{ $a.name }}
              namespace: {{ $ns }}
            {{- end }}
          {{- $extra := default (dict) .extraResources }}

          {{- /* ---- `after`: a Usage of each object it waits on, and whether all are Ready ---- */}}
          {{- $waiting := false }}
          {{- range $i, $a := $after }}
          {{- $ready := false }}
          {{- with index $extra (printf "after-%d" $i) }}{{ with .items }}
          {{- range (index . 0).resource.status.conditions }}
          {{- if and (eq .type "Ready") (eq .status "True") }}{{ $ready = true }}{{ end }}
          {{- end }}
          ---
          apiVersion: protection.crossplane.io/v1beta1
          kind: Usage
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: after-{{ lower $a.kind }}-{{ $a.name }}
          spec:
            of:
              apiVersion: iosxe.netclab.dev/v1alpha1
              kind: {{ $a.kind }}
              resourceRef:
                name: {{ $a.name }}
            by:
              apiVersion: {{ $xr.apiVersion }}
              kind: {{ $xr.kind }}
              resourceRef:
                name: {{ $xr.metadata.name }}
            replayDeletion: true
          {{- end }}{{ end }}
          {{- if not $ready }}{{ $waiting = true }}{{ end }}
          {{- end }}
          {{- $hold := and $waiting (not (hasKey $observed "profile")) }}
          {{- $mine := sortAlpha (default list $xr.spec.transformSets) }}
          {{- $ike := $xr.spec.ikev2Profile | default "" }}

          {{- /* ---- its Requests, once nothing holds them back ---- */}}
          {{- if not $hold }}
          {{- with .extraResources }}{{ with index . "device" }}{{ with .items }}
          {{- $dev := (index . 0).resource }}
          {{- $cred := $dev.spec.credentialsSecretRef }}
          {{- $auth := printf "{{ %s:%s:%s }}" $cred.name $ns $cred.key }}
          {{- $native := printf "https://%s/restconf/data/Cisco-IOS-XE-native:native" $dev.spec.address }}
          {{- $url := printf "%s/crypto/Cisco-IOS-XE-crypto:ipsec/profile=%s" $native $xr.spec.name }}
          {{- $set := dict }}
          {{- if $mine }}{{ $_ := set $set "transform-set" $mine }}{{ end }}
          {{- if $ike }}{{ $_ := set $set "ikev2-profile" $ike }}{{ end }}
          {{- $body := dict "name" $xr.spec.name "set" $set }}
          {{- $put := dict "Cisco-IOS-XE-crypto:profile" (list $body) }}
          {{- /* a merge on native, which exists, creates the profile if it does not */}}
          {{- $patch := dict "Cisco-IOS-XE-native:native" (dict "crypto" (dict "Cisco-IOS-XE-crypto:ipsec" (dict "profile" (list $body)))) }}
          ---
          apiVersion: http.m.crossplane.io/v1alpha2
          kind: Request
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: profile
          spec:
            {{- if eq $policy "Observe" }}
            managementPolicies: ["Observe"]
            {{- else if eq $policy "Merge" }}
            managementPolicies: ["Observe", "Create", "Update"]
            {{- else }}
            managementPolicies: ["*"]
            {{- end }}
            forProvider:
              insecureSkipTLSVerify: {{ $dev.spec.insecureSkipTLSVerify }}
              headers:
                Accept: ["application/yang-data+json"]
                Content-Type: ["application/yang-data+json"]
                Authorization: ["Basic {{ $auth }}"]
              payload:
                baseUrl: {{ $url | quote }}
                body: {{ (ternary $put $patch (eq $policy "Replace")) | toJson | quote }}
              mappings:
              - action: OBSERVE
                method: GET
                url: .payload.baseUrl
              {{- if eq $policy "Merge" }}
              - action: CREATE
                method: PATCH
                url: {{ $native | quote | quote }}
                body: .payload.body
              - action: UPDATE
                method: PATCH
                url: {{ $native | quote | quote }}
                body: .payload.body
              {{- else if eq $policy "Replace" }}
              - action: CREATE
                method: PUT
                url: .payload.baseUrl
                body: .payload.body
              - action: UPDATE
                method: PUT
                url: .payload.baseUrl
                body: .payload.body
              - action: REMOVE
                method: DELETE
                url: .payload.baseUrl
              {{- end }}
              expectedResponseCheck:
                type: CUSTOM
                logic: |
                  if .response.statusCode != 200 then false else
                    .response.body["Cisco-IOS-XE-crypto:profile"][0] as $p
                    | ($p.set // {}) as $s
                    | ($s["transform-set"] // [] | sort) as $router
                  {{- if eq $policy "Replace" }}
                    | $router == {{ $mine | toJson }} and ($s["ikev2-profile"] // "") == {{ $ike | toJson }}
                      and ($s | del(.["transform-set"], .["ikev2-profile"])) == {} and ($p | del(.name, .set)) == {}
                  {{- else }}
                    | {{ $mine | toJson }} - $router == []
                    {{- if $ike }} and $s["ikev2-profile"] == {{ $ike | toJson }}{{ end }}
                  {{- end }}
                  end
          {{- end }}{{ end }}{{ end }}
          {{- end }}

          {{- /* ---- the status: the last GET in the shape of the spec, and Ready ---- */}}
          {{- $status := dict }}
          {{- range $k := list "observed" "drift" "extra" "reverted" }}{{ if hasKey $old $k }}{{ $_ := set $status $k (index $old $k) }}{{ end }}{{ end }}
          {{- $present := hasKey $status "observed" }}
          {{- with index $observed "profile" }}
          {{- $rs := default (dict) .resource.status }}
          {{- $method := "" }}{{ with $rs.requestDetails }}{{ $method = .method | default "" }}{{ end }}
          {{- with $rs.response }}
          {{- $code := int (.statusCode | default 0) }}
          {{- if eq $method "GET" }}
            {{- if eq $code 200 }}
              {{- $p := index (index (fromYaml .body) "Cisco-IOS-XE-crypto:profile") 0 }}
              {{- $s := get $p "set" | default dict }}
              {{- $theirs := list }}{{ range (get $s "transform-set" | default list) }}{{ $theirs = append $theirs . }}{{ end }}
              {{- $theirs = sortAlpha $theirs }}
              {{- $their := get $s "ikev2-profile" | default "" }}
              {{- $drift := list }}
              {{- $more := list }}
              {{- $missing := list }}{{ range $mine }}{{ if not (has . $theirs) }}{{ $missing = append $missing . }}{{ end }}{{ end }}
              {{- if $missing }}{{ $drift = append $drift (dict "field" "transformSets" "device" $theirs "spec" $mine) }}{{ end }}
              {{- if or $mine (eq $policy "Replace") }}
                {{- $beyond := list }}{{ range $theirs }}{{ if not (has . $mine) }}{{ $beyond = append $beyond . }}{{ end }}{{ end }}
                {{- if $beyond }}{{ $more = append $more (dict "field" "transformSets" "device" $beyond) }}{{ end }}
              {{- end }}
              {{- $theirIke := ternary (list $their) list (ne $their "") }}
              {{- if $ike }}
                {{- if ne $their $ike }}{{ $drift = append $drift (dict "field" "ikev2Profile" "device" $theirIke "spec" (list $ike)) }}{{ end }}
              {{- else if and (eq $policy "Replace") $their }}
                {{- $more = append $more (dict "field" "ikev2Profile" "device" $theirIke) }}
              {{- end }}
              {{- if eq $policy "Replace" }}
                {{- range $k, $v := $s }}
                  {{- if not (has $k (list "transform-set" "ikev2-profile")) }}{{ $more = append $more (dict "field" $k "device" (list (toJson $v))) }}{{ end }}
                {{- end }}
                {{- range $k, $v := $p }}
                  {{- if not (has $k (list "name" "set")) }}{{ $more = append $more (dict "field" $k "device" (list (toJson $v))) }}{{ end }}
                {{- end }}
              {{- end }}
              {{- $seen := dict }}
              {{- if $theirs }}{{ $_ := set $seen "transformSets" $theirs }}{{ end }}
              {{- if $their }}{{ $_ := set $seen "ikev2Profile" $their }}{{ end }}
              {{- $_ := set $status "observed" $seen }}
              {{- $_ := set $status "drift" $drift }}
              {{- $_ := set $status "extra" $more }}
              {{- $present = true }}
            {{- else }}
              {{- $_ := unset $status "observed" }}
              {{- $_ := set $status "drift" list }}
              {{- $_ := set $status "extra" list }}
              {{- $present = false }}
            {{- end }}
          {{- else if and $method (ge $code 200) (lt $code 300) }}
            {{- /* after a write that succeeded the response is still the GET before it: the router has the spec, the next GET shows it */}}
            {{- $undid := dict "drift" (default list $old.drift) "extra" (ternary (default list $old.extra) list (eq $policy "Replace")) }}
            {{- if or $undid.drift $undid.extra }}
              {{- $_ := set $undid "time" (dateInZone "2006-01-02T15:04:05Z" (now) "UTC") }}
              {{- $_ := set $status "reverted" $undid }}
            {{- end }}
            {{- $_ := set $status "drift" list }}
            {{- if eq $policy "Replace" }}{{ $_ := set $status "extra" list }}{{ end }}
            {{- $present = true }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- $ready := and $present (not $status.drift) (or (ne $policy "Replace") (not $status.extra)) }}
          ---
          apiVersion: {{ $xr.apiVersion }}
          kind: {{ $xr.kind }}
          {{- if or $hold (not $ready) }}
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/ready: "False"
          {{- end }}
          status: {{ $status | toJson }}
          {{- end }}

  - step: auto-ready
    functionRef:
      name: crossplane-contrib-function-auto-ready
