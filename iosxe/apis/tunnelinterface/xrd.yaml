apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: tunnelinterfaces.iosxe.netclab.dev
spec:
  scope: Namespaced
  group: iosxe.netclab.dev
  names:
    kind: TunnelInterface
    plural: tunnelinterfaces
    categories:
    - crossplane
    - netclab
  defaultCompositionRef:
    name: tunnelinterfaces.iosxe.netclab.dev
  versions:
  - name: v1alpha1
    additionalPrinterColumns:
    - name: DEVICE
      type: string
      jsonPath: .spec.deviceRef.name
    - name: INTERFACE
      type: string
      jsonPath: .spec.name
    - name: TUNNEL-MODE
      type: string
      jsonPath: .spec.mode
    - name: ADDRESS
      type: string
      jsonPath: .spec.ipv4Address
    - name: MODE
      type: string
      jsonPath: .spec.managementPolicy
    - name: OPER
      type: string
      jsonPath: .status.oper.interface
    - name: IKE-SA
      type: string
      jsonPath: .status.oper.activePeers
    - name: WANTS-NAME
      type: string
      jsonPath: .status.wantsName
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            # A thin object (deviceRef and name) only observes.
            x-kubernetes-validations:
            - rule: >-
                self.managementPolicy == 'Observe'
                || (has(self.mode) && has(self.ipv4Address) && has(self.source)
                  && has(self.destination) && has(self.ipsecProfile))
              message: >-
                to write, a tunnel needs mode, ipv4Address, source, destination
                and ipsecProfile
            properties:
              managementPolicy:
                type: string
                description: >-
                  Observe reads the tunnel interface on the router; Manage writes
                  the fields of the spec; FullControl makes the interface the
                  spec, and removes it with the object.
                enum: [Observe, Manage, FullControl]
                default: Observe
              deviceRef:
                type: object
                description: A Device in the tunnel's namespace.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: deviceRef cannot change
                properties:
                  name:
                    type: string
                    minLength: 1
                required:
                - name
              after:
                type: array
                description: >-
                  Objects in the tunnel's namespace that are Ready before the
                  tunnel is applied.
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [kind, name]
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum: [Ikev2Proposal, Ikev2Policy, Ikev2Keyring, Ikev2Profile, IpsecTransformSet, IpsecProfile, TunnelInterface]
                    name:
                      type: string
                      minLength: 1
                  required:
                  - kind
                  - name
              name:
                type: string
                description: Name of the tunnel interface on the router, such as Tunnel0.
                x-kubernetes-validations:
                - rule: >-
                    self.matches('^Tunnel(0|[1-9][0-9]{0,9})$')
                    && int(self.substring(6)) <= 2147483647
                  message: Tunnel and the interface's number, such as Tunnel0
                - rule: self == oldSelf
                  message: name cannot change
              mode:
                type: string
                description: Tunnel mode, `ipsec-ipv4` for `tunnel mode ipsec ipv4`.
                enum: [ipsec-ipv4]
              ipv4Address:
                type: string
                description: IPv4 address of the tunnel interface and its prefix length.
                maxLength: 18
                x-kubernetes-validations:
                - rule: isCIDR(self) && cidr(self).ip().family() == 4
                  message: an IPv4 address and its prefix length, such as 192.168.100.1/24
              source:
                type: string
                description: Interface, or IPv4 address, the tunnel's packets leave from.
                minLength: 1
              destination:
                type: string
                description: IPv4 address of the far end of the tunnel.
                format: ipv4
              ipsecProfile:
                type: string
                description: Name of the IPsec profile on the router that protects the tunnel.
                minLength: 1
            required:
            - deviceRef
            - name
          status:
            type: object
            properties:
              wantsName:
                type: string
                description: The name the object needs, when it has another.
              observed:
                type: object
                description: >-
                  The tunnel interface on the router, in the shape of the spec; a
                  mode the spec cannot hold is given as JSON.
                properties:
                  mode:
                    type: string
                  ipv4Address:
                    type: string
                  source:
                    type: string
                  destination:
                    type: string
                  ipsecProfile:
                    type: string
              drift:
                type: array
                description: Fields whose values in the spec the router lacks.
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    device:
                      type: array
                      items:
                        type: string
                    spec:
                      type: array
                      items:
                        type: string
              extra:
                type: array
                description: >-
                  In FullControl, what the router has beyond the spec; a field the
                  spec cannot hold, such as description or shutdown, given as JSON.
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    device:
                      type: array
                      items:
                        type: string
              reverted:
                type: object
                description: The drift and extra values the last write put back.
                properties:
                  time:
                    type: string
                  drift:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        device:
                          type: array
                          items:
                            type: string
                        spec:
                          type: array
                          items:
                            type: string
                  extra:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        device:
                          type: array
                          items:
                            type: string
              oper:
                type: object
                description: The tunnel as the router reported it at the provider's last poll.
                properties:
                  interface:
                    type: string
                    description: Operational state of the interface, such as ready or lower-layer-down.
                  activePeers:
                    type: string
                    description: Peers with an active IKEv2 SA, of all the tunnel's peers, such as 1/1.
                  peers:
                    type: array
                    items:
                      type: object
                      properties:
                        address:
                          type: string
                          description: IPv4 address of the peer.
                        ikeSA:
                          type: string
                          description: State of the IKEv2 SA with the peer, such as active or pending; none without one.
