apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: ipsectransformsets.iosxe.netclab.dev
spec:
  compositeTypeRef:
    apiVersion: iosxe.netclab.dev/v1alpha1
    kind: IpsecTransformSet
  mode: Pipeline
  pipeline:
  # One Request owns the transform-set over RESTCONF. Its fields are single
  # values, so a value of the spec the router lacks is drift, and in FullControl
  # a value where the spec leaves the field out is extra. The router leaves out a
  # key-bit of 128 and fills in tunnel as the mode, its defaults, and drops
  # esp-hmac when esp becomes esp-gcm or esp-gmac. The router refuses to delete a
  # transform-set an IPsec profile names.
  # Observe only reads; Manage PATCHes the fields of the spec, a merge;
  # FullControl PUTs the transform-set and DELETEs it with the object. The status
  # is the last GET in the shape of the spec; Ready means the mode's write would
  # change nothing.
  # The Device comes first in `after`, as if the spec named it. Once every object
  # in `after` is Ready the Requests are composed, and they stay composed whatever
  # happens to those objects; until then none is, and the XR is not Ready, where
  # Crossplane would call an XR composing nothing Ready. A Usage of each object in
  # `after` holds back its delete until this XR is gone.
  - step: requests
    functionRef:
      name: crossplane-contrib-function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource }}
          {{- $ns := $xr.metadata.namespace }}
          {{- $after := default (list) $xr.spec.after }}
          {{- $observed := default (dict) .observed.resources }}
          {{- $policy := $xr.spec.managementPolicy | default "Observe" }}
          {{- $old := default (dict) $xr.status }}

          {{- /* ---- its name: under another name the object composes nothing ---- */}}
          {{- /* <device>--<slug>--<8 hex>, at most 63 characters */}}
          {{- $device := $xr.spec.deviceRef.name }}
          {{- $after = prepend $after (dict "kind" "Device" "name" $device) }}
          {{- $slug := regexReplaceAll "[^a-z0-9]+" (lower $xr.spec.name) "-" | trimAll "-" }}
          {{- $slug = trunc (int (max 0 (sub 51 (len $device)))) $slug | trimSuffix "-" }}
          {{- $want := printf "%s--%s--%s" $device $slug (sha256sum $xr.spec.name | trunc 8) }}
          {{- if ne $xr.metadata.name $want }}
          ---
          apiVersion: {{ $xr.apiVersion }}
          kind: {{ $xr.kind }}
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/ready: "False"
          status:
            wantsName: {{ $want }}
          {{- else }}

          {{- /* ---- what it requires ---- */}}
          ---
          apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
          kind: ExtraResources
          requirements:
            device:
              apiVersion: iosxe.netclab.dev/v1alpha1
              kind: Device
              matchName: {{ $device }}
              namespace: {{ $ns }}
            {{- range $i, $a := $after }}
            after-{{ $i }}:
              apiVersion: iosxe.netclab.dev/v1alpha1
              kind: {{ $a.kind }}
              matchName: {{ $a.name }}
              namespace: {{ $ns }}
            {{- end }}
          {{- $extra := default (dict) .extraResources }}

          {{- /* ---- `after`: a Usage of each object it waits on, and whether all are Ready ---- */}}
          {{- $waiting := false }}
          {{- range $i, $a := $after }}
          {{- $ready := false }}
          {{- with index $extra (printf "after-%d" $i) }}{{ with .items }}
          {{- range (index . 0).resource.status.conditions }}
          {{- if and (eq .type "Ready") (eq .status "True") }}{{ $ready = true }}{{ end }}
          {{- end }}
          ---
          apiVersion: protection.crossplane.io/v1beta1
          kind: Usage
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: after-{{ lower $a.kind }}-{{ $a.name }}
          spec:
            of:
              apiVersion: iosxe.netclab.dev/v1alpha1
              kind: {{ $a.kind }}
              resourceRef:
                name: {{ $a.name }}
            by:
              apiVersion: {{ $xr.apiVersion }}
              kind: {{ $xr.kind }}
              resourceRef:
                name: {{ $xr.metadata.name }}
            replayDeletion: true
          {{- end }}{{ end }}
          {{- if not $ready }}{{ $waiting = true }}{{ end }}
          {{- end }}
          {{- $hold := and $waiting (not (hasKey $observed "transform-set")) }}
          {{- $fields := list "esp" "keyBits" "espHmac" "mode" }}
          {{- $keyed := list "esp-aes" "esp-gcm" "esp-gmac" }}
          {{- $spec := dict }}
          {{- range $f := $fields }}{{ with get $xr.spec $f }}{{ $_ := set $spec $f (toString .) }}{{ end }}{{ end }}

          {{- /* ---- its Requests, once nothing holds them back ---- */}}
          {{- /* the transform-set a PUT of the spec leaves, the router's defaults in */}}
          {{- $whole := deepCopy $spec }}
          {{- if and (has (get $spec "esp") $keyed) (not (hasKey $spec "keyBits")) }}{{ $_ := set $whole "keyBits" "128" }}{{ end }}
          {{- if not (hasKey $spec "mode") }}{{ $_ := set $whole "mode" "tunnel" }}{{ end }}
          {{- if not $hold }}
          {{- with .extraResources }}{{ with index . "device" }}{{ with .items }}
          {{- $dev := (index . 0).resource }}
          {{- $cred := $dev.spec.credentialsSecretRef }}
          {{- $auth := printf "{{ %s:%s:%s }}" $cred.name $ns $cred.key }}
          {{- $native := printf "https://%s/restconf/data/Cisco-IOS-XE-native:native" $dev.spec.address }}
          {{- $url := printf "%s/crypto/Cisco-IOS-XE-crypto:ipsec/transform-set=%s" $native $xr.spec.name }}
          {{- $put := dict "tag" $xr.spec.name }}
          {{- $merge := dict "tag" $xr.spec.name }}
          {{- with $spec.esp }}{{ $_ := set $put "esp" . }}{{ $_ := set $merge "esp" . }}{{ end }}
          {{- with $spec.espHmac }}{{ $_ := set $put "esp-hmac" . }}{{ $_ := set $merge "esp-hmac" . }}{{ end }}
          {{- /* the GET leaves out a key-bit of 128, so the PUT does too; a merge has to name it to replace another */}}
          {{- with $spec.keyBits }}{{ if ne . "128" }}{{ $_ := set $put "key-bit" . }}{{ end }}{{ $_ := set $merge "key-bit" . }}{{ end }}
          {{- $modes := dict "tunnel" (dict "tunnel-choice" (list nil)) "transport" (dict "transport-choice" (dict)) }}
          {{- $_ := set $put "mode" (get $modes $whole.mode) }}
          {{- with $spec.mode }}{{ $_ := set $merge "mode" (get $modes .) }}{{ end }}
          {{- /* a merge on native, which exists, creates the transform-set if it does not */}}
          {{- $patch := dict "Cisco-IOS-XE-native:native" (dict "crypto" (dict "Cisco-IOS-XE-crypto:ipsec" (dict "transform-set" (list $merge)))) }}
          ---
          apiVersion: http.m.crossplane.io/v1alpha2
          kind: Request
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: transform-set
          spec:
            {{- if eq $policy "Observe" }}
            managementPolicies: ["Observe"]
            {{- else if eq $policy "Manage" }}
            managementPolicies: ["Observe", "Create", "Update"]
            {{- else }}
            managementPolicies: ["*"]
            {{- end }}
            forProvider:
              insecureSkipTLSVerify: {{ $dev.spec.insecureSkipTLSVerify }}
              headers:
                Accept: ["application/yang-data+json"]
                Content-Type: ["application/yang-data+json"]
                Authorization: ["Basic {{ $auth }}"]
              payload:
                baseUrl: {{ $url | quote }}
                body: {{ (ternary (dict "Cisco-IOS-XE-crypto:transform-set" (list $put)) $patch (eq $policy "FullControl")) | toJson | quote }}
              mappings:
              - action: OBSERVE
                method: GET
                url: .payload.baseUrl
              {{- if eq $policy "Manage" }}
              - action: CREATE
                method: PATCH
                url: {{ $native | quote | quote }}
                body: .payload.body
              - action: UPDATE
                method: PATCH
                url: {{ $native | quote | quote }}
                body: .payload.body
              {{- else if eq $policy "FullControl" }}
              - action: CREATE
                method: PUT
                url: .payload.baseUrl
                body: .payload.body
              - action: UPDATE
                method: PUT
                url: .payload.baseUrl
                body: .payload.body
              - action: REMOVE
                method: DELETE
                url: .payload.baseUrl
              {{- end }}
              expectedResponseCheck:
                type: CUSTOM
                logic: |
                  if .response.statusCode != 200 then false else
                    .response.body["Cisco-IOS-XE-crypto:transform-set"][0] as $t
                    | {esp: $t.esp,
                       keyBits: (if ($t.esp | IN("esp-aes", "esp-gcm", "esp-gmac")) then ($t["key-bit"] // "128") else null end),
                       espHmac: $t["esp-hmac"],
                       mode: ($t.mode // {} | keys | first // "" | sub("-choice$"; ""))}
                    | with_entries(select(.value != null and .value != "")) as $router
                  {{- if eq $policy "FullControl" }}
                    | $router == {{ $whole | toJson }} and ($t | del(.tag, .esp, .["key-bit"], .["esp-hmac"], .mode)) == {}
                  {{- else }}
                    | {{ $spec | toJson }} | all(to_entries[]; $router[.key] == .value)
                  {{- end }}
                  end
          {{- end }}{{ end }}{{ end }}
          {{- end }}

          {{- /* ---- the status: the last GET in the shape of the spec, and Ready ---- */}}
          {{- $status := dict }}
          {{- range $k := list "observed" "drift" "extra" "reverted" }}{{ if hasKey $old $k }}{{ $_ := set $status $k (index $old $k) }}{{ end }}{{ end }}
          {{- $present := hasKey $status "observed" }}
          {{- with index $observed "transform-set" }}
          {{- $rs := default (dict) .resource.status }}
          {{- $method := "" }}{{ with $rs.requestDetails }}{{ $method = .method | default "" }}{{ end }}
          {{- with $rs.response }}
          {{- $code := int (.statusCode | default 0) }}
          {{- if eq $method "GET" }}
            {{- if eq $code 200 }}
              {{- $t := index (index (fromYaml .body) "Cisco-IOS-XE-crypto:transform-set") 0 }}
              {{- $router := dict }}
              {{- with $t.esp }}{{ $_ := set $router "esp" . }}{{ end }}
              {{- if has ($t.esp | default "") $keyed }}{{ $_ := set $router "keyBits" (get $t "key-bit" | default "128" | toString) }}{{ end }}
              {{- with get $t "esp-hmac" }}{{ $_ := set $router "espHmac" . }}{{ end }}
              {{- with $t.mode }}{{ range $k, $v := . }}{{ $_ := set $router "mode" (trimSuffix "-choice" $k) }}{{ end }}{{ end }}
              {{- $drift := list }}
              {{- $more := list }}
              {{- range $f := $fields }}
                {{- $theirs := ternary (list (get $router $f)) list (hasKey $router $f) }}
                {{- if hasKey $spec $f }}
                  {{- if ne (get $router $f) (get $spec $f) }}{{ $drift = append $drift (dict "field" $f "device" $theirs "spec" (list (get $spec $f))) }}{{ end }}
                {{- else if and (eq $policy "FullControl") (hasKey $router $f) (ne (get $router $f) (get $whole $f)) }}
                  {{- $more = append $more (dict "field" $f "device" $theirs) }}
                {{- end }}
              {{- end }}
              {{- if eq $policy "FullControl" }}
                {{- range $k, $v := $t }}
                  {{- if not (has $k (list "tag" "esp" "key-bit" "esp-hmac" "mode")) }}{{ $more = append $more (dict "field" $k "device" (list (toJson $v))) }}{{ end }}
                {{- end }}
              {{- end }}
              {{- $seen := deepCopy $router }}
              {{- with $router.keyBits }}{{ $_ := set $seen "keyBits" (atoi .) }}{{ end }}
              {{- $_ := set $status "observed" $seen }}
              {{- $_ := set $status "drift" $drift }}
              {{- $_ := set $status "extra" $more }}
              {{- $present = true }}
            {{- else }}
              {{- $_ := unset $status "observed" }}
              {{- $_ := set $status "drift" list }}
              {{- $_ := set $status "extra" list }}
              {{- $present = false }}
            {{- end }}
          {{- else if and $method (ge $code 200) (lt $code 300) }}
            {{- /* after a write that succeeded the response is still the GET before it: the router has the spec, the next GET shows it */}}
            {{- $undid := dict "drift" (default list $old.drift) "extra" (ternary (default list $old.extra) list (eq $policy "FullControl")) }}
            {{- if or $undid.drift $undid.extra }}
              {{- $_ := set $undid "time" (dateInZone "2006-01-02T15:04:05Z" (now) "UTC") }}
              {{- $_ := set $status "reverted" $undid }}
            {{- end }}
            {{- $_ := set $status "drift" list }}
            {{- if eq $policy "FullControl" }}{{ $_ := set $status "extra" list }}{{ end }}
            {{- $present = true }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- $ready := and $present (not $status.drift) (or (ne $policy "FullControl") (not $status.extra)) }}
          ---
          apiVersion: {{ $xr.apiVersion }}
          kind: {{ $xr.kind }}
          {{- if or $hold (not $ready) }}
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/ready: "False"
          {{- end }}
          status: {{ $status | toJson }}
          {{- end }}

  - step: auto-ready
    functionRef:
      name: crossplane-contrib-function-auto-ready
