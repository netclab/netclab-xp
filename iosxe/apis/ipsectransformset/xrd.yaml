apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: ipsectransformsets.iosxe.netclab.dev
spec:
  scope: Namespaced
  group: iosxe.netclab.dev
  names:
    kind: IpsecTransformSet
    plural: ipsectransformsets
    categories:
    - crossplane
    - netclab
  defaultCompositionRef:
    name: ipsectransformsets.iosxe.netclab.dev
  versions:
  - name: v1alpha1
    additionalPrinterColumns:
    - name: DEVICE
      type: string
      jsonPath: .spec.deviceRef.name
    - name: TRANSFORM-SET
      type: string
      jsonPath: .spec.name
    - name: MODE
      type: string
      jsonPath: .spec.managementPolicy
    - name: WANTS-NAME
      type: string
      jsonPath: .status.wantsName
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            # A thin object (deviceRef and name) only observes. The router's own
            # rules, from the `when` on key-bit and esp-hmac.
            x-kubernetes-validations:
            - rule: self.managementPolicy == 'Observe' || has(self.esp)
              message: to write, a transform-set needs esp
            - rule: "!has(self.keyBits) || (has(self.esp) && self.esp in ['esp-aes', 'esp-gcm', 'esp-gmac'])"
              message: keyBits goes only with esp-aes, esp-gcm and esp-gmac
            - rule: "!has(self.espHmac) || !has(self.esp) || !(self.esp in ['esp-gcm', 'esp-gmac'])"
              message: esp-gcm and esp-gmac carry their own integrity, so no espHmac
            properties:
              managementPolicy:
                type: string
                description: >-
                  Observe reads the transform-set on the router; Manage writes
                  the fields of the spec; FullControl makes the transform-set the
                  spec, and removes it with the object.
                enum: [Observe, Manage, FullControl]
                default: Observe
              deviceRef:
                type: object
                description: A Device in the transform-set's namespace.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: deviceRef cannot change
                properties:
                  name:
                    type: string
                    minLength: 1
                required:
                - name
              after:
                type: array
                description: >-
                  Objects in the transform-set's namespace that are Ready before the
                  transform-set is applied.
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [kind, name]
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum: [Ikev2Proposal, Ikev2Policy, Ikev2Keyring, Ikev2Profile, IpsecTransformSet, IpsecProfile, TunnelInterface]
                    name:
                      type: string
                      minLength: 1
                  required:
                  - kind
                  - name
              name:
                type: string
                description: Name (tag) of the transform-set on the router.
                minLength: 1
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: name cannot change
              esp:
                type: string
                description: ESP encryption transform.
                enum: [esp-3des, esp-aes, esp-des, esp-gcm, esp-gmac, esp-null, esp-seal, esp-192-aes, esp-256-aes]
              keyBits:
                type: integer
                description: Key length of esp-aes, esp-gcm or esp-gmac; the router's default is 128.
                enum: [128, 192, 256]
              espHmac:
                type: string
                description: ESP integrity transform.
                enum: [esp-md5-hmac, esp-sha-hmac, esp-sha256-hmac, esp-sha384-hmac, esp-sha512-hmac]
              mode:
                type: string
                description: Encapsulation mode; the router's default is tunnel.
                enum: [tunnel, transport]
            required:
            - deviceRef
            - name
          status:
            type: object
            properties:
              wantsName:
                type: string
                description: The name the object needs, when it has another.
              observed:
                type: object
                description: The transform-set on the router, in the shape of the spec.
                properties:
                  esp:
                    type: string
                  keyBits:
                    type: integer
                  espHmac:
                    type: string
                  mode:
                    type: string
              drift:
                type: array
                description: Fields whose values in the spec the router lacks.
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    device:
                      type: array
                      items:
                        type: string
                    spec:
                      type: array
                      items:
                        type: string
              extra:
                type: array
                description: >-
                  In FullControl, the values the router has where the spec leaves
                  a field out, the router's defaults aside; a field the spec cannot
                  hold is given as JSON.
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    device:
                      type: array
                      items:
                        type: string
              reverted:
                type: object
                description: The drift and extra values the last write put back.
                properties:
                  time:
                    type: string
                  drift:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        device:
                          type: array
                          items:
                            type: string
                        spec:
                          type: array
                          items:
                            type: string
                  extra:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        device:
                          type: array
                          items:
                            type: string
