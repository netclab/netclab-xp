apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: ikev2keyrings.iosxe.netclab.dev
spec:
  scope: Namespaced
  group: iosxe.netclab.dev
  names:
    kind: Ikev2Keyring
    plural: ikev2keyrings
    categories:
    - crossplane
    - netclab
  defaultCompositionRef:
    name: ikev2keyrings.iosxe.netclab.dev
  versions:
  - name: v1alpha1
    additionalPrinterColumns:
    - name: DEVICE
      type: string
      jsonPath: .spec.deviceRef.name
    - name: KEYRING
      type: string
      jsonPath: .spec.name
    - name: MODE
      type: string
      jsonPath: .spec.managementPolicy
    - name: WANTS-NAME
      type: string
      jsonPath: .status.wantsName
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            # A thin object (deviceRef and name) only observes.
            x-kubernetes-validations:
            - rule: >-
                self.managementPolicy == 'Observe'
                || (has(self.peers) && self.peers.all(p, has(p.address) && has(p.preSharedKeySecretRef)))
              message: to write, a keyring needs peers, each with address and preSharedKeySecretRef
            properties:
              managementPolicy:
                type: string
                description: >-
                  Observe reads the keyring on the router; Merge writes the
                  fields of the spec; Replace makes the keyring the spec, and
                  removes it with the object. Keys follow their own rules.
                enum: [Observe, Merge, Replace]
                default: Observe
              deviceRef:
                type: object
                description: A Device in the keyring's namespace.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: deviceRef cannot change
                properties:
                  name:
                    type: string
                    minLength: 1
                required:
                - name
              after:
                type: array
                description: >-
                  Objects in the keyring's namespace that are Ready before the
                  keyring is applied.
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [kind, name]
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum: [Ikev2Proposal, Ikev2Policy, Ikev2Keyring, Ikev2Profile, IpsecTransformSet, IpsecProfile, TunnelInterface]
                    name:
                      type: string
                      minLength: 1
                  required:
                  - kind
                  - name
              name:
                type: string
                description: Name of the keyring on the router.
                minLength: 1
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: name cannot change
              peers:
                type: array
                minItems: 1
                maxItems: 16
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [name]
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                    address:
                      type: string
                      description: IPv4 address of the peer.
                      format: ipv4
                    preSharedKeySecretRef:
                      type: object
                      description: A Secret in the keyring's namespace; the key holds the pre-shared key.
                      properties:
                        name:
                          type: string
                          minLength: 1
                        key:
                          type: string
                          minLength: 1
                      required:
                      - name
                      - key
                    ppk:
                      type: object
                      description: >-
                        Manual post-quantum pre-shared key (RFC 8784), always
                        required: the tunnel does not come up without it. Both
                        ends of a tunnel have the same id.
                      properties:
                        id:
                          type: string
                          minLength: 1
                        keySecretRef:
                          type: object
                          description: >-
                            A Secret in the keyring's namespace; the key holds
                            the PPK as hex of printable ASCII characters.
                          properties:
                            name:
                              type: string
                              minLength: 1
                            key:
                              type: string
                              minLength: 1
                          required:
                          - name
                          - key
                      required:
                      - id
                      - keySecretRef
                  required:
                  - name
            required:
            - deviceRef
            - name
          status:
            type: object
            properties:
              wantsName:
                type: string
                description: The name the object needs, when it has another.
              origin:
                type: string
                description: >-
                  TakenOver when the first read found the keyring on the router,
                  Created when it did not; a key without its mark is written only
                  where the package created the keyring, or where the router holds
                  no pre-shared key.
                enum: [TakenOver, Created]
              observed:
                type: object
                description: >-
                  The keyring on the router, in the shape of the spec: of a key,
                  only whether it is there. On IOS XE 17.18 no read returns a PPK.
                properties:
                  peers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        address:
                          type: string
                        preSharedKey:
                          type: object
                          properties:
                            present:
                              type: boolean
                            encryption:
                              type: string
              drift:
                type: array
                description: Fields whose values in the spec the router lacks; keys aside.
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    device:
                      type: array
                      items:
                        type: string
                    spec:
                      type: array
                      items:
                        type: string
              extra:
                type: array
                description: >-
                  Peers the router has beyond the spec; in Replace also a field
                  the spec cannot hold, such as a peer's description, given as JSON.
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    device:
                      type: array
                      items:
                        type: string
              reverted:
                type: object
                description: The drift and extra values the last write put back.
                properties:
                  time:
                    type: string
                  drift:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        device:
                          type: array
                          items:
                            type: string
                        spec:
                          type: array
                          items:
                            type: string
                  extra:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        device:
                          type: array
                          items:
                            type: string
              missingSecrets:
                type: array
                description: >-
                  Secrets and keys the spec names that the namespace lacks, as
                  <secret>/<key>.
                items:
                  type: string
              keys:
                type: array
                description: The keys of the spec, never their values.
                items:
                  type: object
                  properties:
                    path:
                      type: string
                      description: The key on the router, such as peers[R3].preSharedKey.
                    written:
                      type: boolean
                      description: The router holds the mark of the key's value in its Secret.
