apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: ikev2keyrings.iosxe.netclab.dev
spec:
  scope: Namespaced
  group: iosxe.netclab.dev
  names:
    kind: Ikev2Keyring
    plural: ikev2keyrings
    categories:
    - crossplane
    - netclab
  defaultCompositionRef:
    name: ikev2keyrings.iosxe.netclab.dev
  versions:
  - name: v1alpha1
    additionalPrinterColumns:
    - name: DEVICE
      type: string
      jsonPath: .spec.deviceRef.name
    - name: KEYRING
      type: string
      jsonPath: .spec.name
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              deviceRef:
                type: object
                description: A Device in the keyring's namespace.
                properties:
                  name:
                    type: string
                    minLength: 1
                required:
                - name
              after:
                type: array
                description: >-
                  Objects in the keyring's namespace that are Ready before the
                  keyring is applied.
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [kind, name]
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum: [Ikev2Proposal, Ikev2Policy, Ikev2Keyring, Ikev2Profile, IpsecTransformSet, IpsecProfile, TunnelInterface]
                    name:
                      type: string
                      minLength: 1
                  required:
                  - kind
                  - name
              name:
                type: string
                description: Name of the keyring on the router.
                minLength: 1
              peers:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                    address:
                      type: string
                      description: IPv4 address of the peer.
                      format: ipv4
                    preSharedKeySecretRef:
                      type: object
                      description: A Secret in the keyring's namespace; the key holds the pre-shared key.
                      properties:
                        name:
                          type: string
                          minLength: 1
                        key:
                          type: string
                          minLength: 1
                      required:
                      - name
                      - key
                    ppk:
                      type: object
                      description: >-
                        Manual post-quantum pre-shared key (RFC 8784), always
                        required: the tunnel does not come up without it. A new
                        key goes with a new id; a key changed under the same id
                        is not applied.
                      properties:
                        id:
                          type: string
                          minLength: 1
                        keySecretRef:
                          type: object
                          description: >-
                            A Secret in the keyring's namespace; the key holds
                            the PPK as hex of printable ASCII characters.
                          properties:
                            name:
                              type: string
                              minLength: 1
                            key:
                              type: string
                              minLength: 1
                          required:
                          - name
                          - key
                      required:
                      - id
                      - keySecretRef
                  required:
                  - name
                  - address
                  - preSharedKeySecretRef
            required:
            - deviceRef
            - name
            - peers
