apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: ikev2keyrings.iosxe.netclab.dev
spec:
  compositeTypeRef:
    apiVersion: iosxe.netclab.dev/v1alpha1
    kind: Ikev2Keyring
  mode: Pipeline
  pipeline:
  # One Request owns the keyring, PSKs included; it checks that a PSK is there,
  # not its value. Each key has a Request of its own, once the keyring's is
  # Ready: one RPC writes the key, its mark, an EEM variable, and clears the
  # peer's SA, so the key is in use at once. It observes only the mark.
  # Once every object in `after` is Ready the Requests are composed, and they
  # stay composed whatever happens to those objects; until then none is, and the
  # XR is not Ready, where Crossplane would call an XR composing nothing Ready. A
  # Usage of each object in `after` holds back its delete until this XR is gone.
  - step: requests
    functionRef:
      name: crossplane-contrib-function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource }}
          {{- $ns := $xr.metadata.namespace }}
          {{- $after := default (list) $xr.spec.after }}
          {{- $observed := default (dict) .observed.resources }}
          {{- $rewrite := index (default (dict) $xr.metadata.annotations) "iosxe.netclab.dev/rewrite-keys" | default "" }}
          {{- $secretNames := list }}
          {{- range $xr.spec.peers }}
          {{- $secretNames = append $secretNames .preSharedKeySecretRef.name }}
          {{- with .ppk }}{{ $secretNames = append $secretNames .keySecretRef.name }}{{ end }}
          {{- end }}
          {{- $secretNames = $secretNames | uniq | sortAlpha }}
          ---
          apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
          kind: ExtraResources
          requirements:
            device:
              apiVersion: iosxe.netclab.dev/v1alpha1
              kind: Device
              matchName: {{ $xr.spec.deviceRef.name }}
              namespace: {{ $ns }}
            {{- range $i, $a := $after }}
            after-{{ $i }}:
              apiVersion: iosxe.netclab.dev/v1alpha1
              kind: {{ $a.kind }}
              matchName: {{ $a.name }}
              namespace: {{ $ns }}
            {{- end }}
            {{- /* required, so a changed value reconciles */}}
            {{- range $i, $s := $secretNames }}
            secret-{{ $i }}:
              apiVersion: v1
              kind: Secret
              matchName: {{ $s }}
              namespace: {{ $ns }}
            {{- end }}
          {{- $extra := default (dict) .extraResources }}
          {{- $secrets := dict }}
          {{- range $i, $s := $secretNames }}{{ with index $extra (printf "secret-%d" $i) }}{{ with .items }}
          {{- $_ := set $secrets $s (index . 0).resource }}
          {{- end }}{{ end }}{{ end }}
          {{- $keys := list }}
          {{- $missing := list }}
          {{- range $xr.spec.peers }}
          {{- $peer := . }}
          {{- $refs := list (dict "type" "psk" "ref" .preSharedKeySecretRef "id" "" "path" (printf "peers[%s].preSharedKey" .name)) }}
          {{- with .ppk }}{{ $refs = append $refs (dict "type" "ppk" "ref" .keySecretRef "id" .id "path" (printf "peers[%s].ppk" $peer.name)) }}{{ end }}
          {{- range $refs }}
          {{- $sec := index $secrets .ref.name }}
          {{- $value := "" }}
          {{- if $sec }}{{ $value = index (default (dict) $sec.data) .ref.key | default "" }}{{ end }}
          {{- $mark := "" }}
          {{- if $value }}
          {{- /* a key is written again only when one of these changes */}}
          {{- $in := printf "%s/%s" $sec.metadata.uid $value }}
          {{- if .id }}{{ $in = printf "%s/%s" $in .id }}{{ end }}
          {{- if $rewrite }}{{ $in = printf "%s/%s" $in $rewrite }}{{ end }}
          {{- $mark = sha256sum $in | trunc 8 }}
          {{- else }}
          {{- $missing = append $missing (printf "%s/%s" .ref.name .ref.key) }}
          {{- end }}
          {{- $keys = append $keys (dict "type" .type "peer" $peer.name "address" $peer.address "ref" .ref "id" .id "path" .path "mark" $mark "resource" (printf "%s-%s" .type (lower $peer.name))) }}
          {{- end }}
          {{- end }}
          {{- $missing = $missing | uniq }}
          {{- $waiting := false }}
          {{- range $i, $a := $after }}
          {{- $ready := false }}
          {{- with index $extra (printf "after-%d" $i) }}{{ with .items }}
          {{- range (index . 0).resource.status.conditions }}
          {{- if and (eq .type "Ready") (eq .status "True") }}{{ $ready = true }}{{ end }}
          {{- end }}
          ---
          apiVersion: protection.crossplane.io/v1beta1
          kind: Usage
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: after-{{ lower $a.kind }}-{{ $a.name }}
          spec:
            of:
              apiVersion: iosxe.netclab.dev/v1alpha1
              kind: {{ $a.kind }}
              resourceRef:
                name: {{ $a.name }}
            by:
              apiVersion: {{ $xr.apiVersion }}
              kind: {{ $xr.kind }}
              resourceRef:
                name: {{ $xr.metadata.name }}
            replayDeletion: true
          {{- end }}{{ end }}
          {{- if not $ready }}{{ $waiting = true }}{{ end }}
          {{- end }}
          {{- /* a missing Secret holds back what was not composed yet */}}
          {{- $hold := and (or $waiting $missing) (not (hasKey $observed "keyring")) }}
          {{- if not $hold }}
          {{- with .extraResources }}{{ with index . "device" }}{{ with .items }}
          {{- $dev := (index . 0).resource }}
          {{- $cred := $dev.spec.credentialsSecretRef }}
          {{- $auth := printf "{{ %s:%s:%s }}" $cred.name $ns $cred.key }}
          {{- $native := printf "https://%s/restconf/data/Cisco-IOS-XE-native:native" $dev.spec.address }}
          {{- $keyring := printf "%s/crypto/Cisco-IOS-XE-crypto:ikev2/keyring=%s" $native $xr.spec.name }}
          {{- $rpc := printf "https://%s/restconf/operations/Cisco-IOS-XE-cli-rpc:config-ios-cli-rpc" $dev.spec.address }}
          {{- $peers := list }}
          {{- $owned := list }}
          {{- range $xr.spec.peers }}
            {{- $psk := printf "{{ %s:%s:%s }}" .preSharedKeySecretRef.name $ns .preSharedKeySecretRef.key }}
            {{- $peers = append $peers (dict "name" .name "address" (dict "ipv4" (dict "ipv4-address" .address)) "pre-shared-key" (dict "key" $psk)) }}
            {{- $owned = append $owned (dict "name" .name "address" .address "psk" true) }}
          {{- end }}
          ---
          apiVersion: http.m.crossplane.io/v1alpha2
          kind: Request
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: keyring
          spec:
            forProvider:
              insecureSkipTLSVerify: {{ $dev.spec.insecureSkipTLSVerify }}
              headers:
                Accept: ["application/yang-data+json"]
                Content-Type: ["application/yang-data+json"]
                Authorization: ["Basic {{ $auth }}"]
              payload:
                baseUrl: {{ $keyring | quote }}
                body: {{ dict "Cisco-IOS-XE-crypto:keyring" (list (dict "name" $xr.spec.name "peer" $peers)) | toJson | quote }}
              mappings:
              - action: OBSERVE
                method: GET
                url: .payload.baseUrl
              - action: CREATE
                method: PUT
                url: .payload.baseUrl
                body: .payload.body
              - action: UPDATE
                method: PUT
                url: .payload.baseUrl
                body: .payload.body
              - action: REMOVE
                method: DELETE
                url: .payload.baseUrl
              expectedResponseCheck:
                type: CUSTOM
                logic: |
                  if .response.statusCode != 200 then false else
                    ([.response.body["Cisco-IOS-XE-crypto:keyring"][0].peer[]?
                      | {name, address: .address.ipv4["ipv4-address"], psk: has("pre-shared-key")}]
                      | sort_by(.name))
                    == ({{ $owned | toJson }} | sort_by(.name))
                  end
          {{- $keyringReady := false }}
          {{- with index $observed "keyring" }}
          {{- range .resource.status.conditions }}
          {{- if and (eq .type "Ready") (eq .status "True") }}{{ $keyringReady = true }}{{ end }}
          {{- end }}
          {{- end }}
          {{- range $keys }}{{ if or $keyringReady (hasKey $observed .resource) }}
          {{- $k := . }}
          {{- if $k.mark }}
          {{- $place := printf "Ikev2Keyring/%s/%s/%s" $xr.spec.name $k.peer $k.type }}
          {{- $var := printf "netclab-%s" (sha256sum $place | trunc 8) }}
          {{- $value := printf "%s %s" $k.mark $place | trunc 180 }}
          {{- $secret := printf "{{ %s:%s:%s }}" $k.ref.name $ns $k.ref.key }}
          {{- $line := printf "pre-shared-key %s" $secret }}
          {{- if eq $k.type "ppk" }}{{ $line = printf "ppk manual id %s key hex %s required" $k.id $secret }}{{ end }}
          {{- /* the key, the mark, then the clear; the RPC stops at a refused key */}}
          {{- $body := dict "Cisco-IOS-XE-cli-rpc:input" (dict "config-clis" (printf "crypto ikev2 keyring %s\n peer %s\n  %s\n  exit\n exit\nevent manager environment %s \"%s\"\ndo clear crypto ikev2 sa remote %s" $xr.spec.name $k.peer $line $var $value $k.address)) | toJson }}
          {{- $remove := dict "Cisco-IOS-XE-cli-rpc:input" (dict "config-clis" (printf "crypto ikev2 keyring %s\n peer %s\n  no ppk manual id %s\n  exit\n exit\nno event manager environment %s\ndo clear crypto ikev2 sa remote %s" $xr.spec.name $k.peer $k.id $var $k.address)) | toJson }}
          ---
          apiVersion: http.m.crossplane.io/v1alpha2
          kind: Request
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $k.resource }}
          spec:
            forProvider:
              insecureSkipTLSVerify: {{ $dev.spec.insecureSkipTLSVerify }}
              headers:
                Accept: ["application/yang-data+json"]
                Content-Type: ["application/yang-data+json"]
                Authorization: ["Basic {{ $auth }}"]
              payload:
                baseUrl: {{ printf "%s/event/Cisco-IOS-XE-eem:manager/environment=%s" $native $var | quote }}
                body: {{ $body | quote }}
              mappings:
              - action: OBSERVE
                method: GET
                url: .payload.baseUrl
              - action: CREATE
                method: POST
                url: {{ $rpc | quote | quote }}
                body: .payload.body
              - action: UPDATE
                method: POST
                url: {{ $rpc | quote | quote }}
                body: .payload.body
              {{- /* a PSK goes with its peer; a PPK leaves the peer */}}
              {{- if eq $k.type "psk" }}
              - action: REMOVE
                method: DELETE
                url: .payload.baseUrl
              {{- else }}
              - action: REMOVE
                method: POST
                url: {{ $rpc | quote | quote }}
                body: {{ $remove | quote }}
              {{- end }}
              isRemovedCheck:
                type: CUSTOM
                logic: .response.statusCode == 404
              expectedResponseCheck:
                type: CUSTOM
                logic: |
                  .response.statusCode == 200 and
                    ((.response.body["Cisco-IOS-XE-eem:environment"][0].value // "") | split(" ")[0]) == {{ $k.mark | quote }}
          {{- else }}{{ with index $observed $k.resource }}
          ---
          apiVersion: http.m.crossplane.io/v1alpha2
          kind: Request
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $k.resource }}
          spec: {{ .resource.spec | toJson }}
          {{- end }}{{ end }}
          {{- end }}{{ end }}
          {{- end }}{{ end }}{{ end }}
          {{- end }}
          {{- $status := list }}
          {{- range $keys }}
          {{- $written := false }}
          {{- with index $observed .resource }}{{ range .resource.status.conditions }}
          {{- if and (eq .type "Ready") (eq .status "True") }}{{ $written = true }}{{ end }}
          {{- end }}{{ end }}
          {{- $status = append $status (dict "path" .path "written" $written) }}
          {{- end }}
          ---
          apiVersion: {{ $xr.apiVersion }}
          kind: {{ $xr.kind }}
          {{- if or $hold $missing }}
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/ready: "False"
          {{- end }}
          status:
            missingSecrets: {{ $missing | toJson }}
            keys: {{ $status | toJson }}

  - step: auto-ready
    functionRef:
      name: crossplane-contrib-function-auto-ready
