apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: ikev2proposals.iosxe.netclab.dev
spec:
  scope: Namespaced
  group: iosxe.netclab.dev
  names:
    kind: Ikev2Proposal
    plural: ikev2proposals
    categories:
    - crossplane
    - netclab
  defaultCompositionRef:
    name: ikev2proposals.iosxe.netclab.dev
  versions:
  - name: v1alpha1
    additionalPrinterColumns:
    - name: DEVICE
      type: string
      jsonPath: .spec.deviceRef.name
    - name: PROPOSAL
      type: string
      jsonPath: .spec.name
    - name: MODE
      type: string
      jsonPath: .spec.managementPolicy
    - name: WANTS-NAME
      type: string
      jsonPath: .status.wantsName
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            # A thin object (deviceRef and name) only observes. To write, the
            # router's own rule, from the `must` on a policy's proposals: a
            # proposal a policy can use has a group and either a non-GCM cipher
            # with an integrity algorithm, or a GCM cipher with a PRF.
            x-kubernetes-validations:
            - rule: >-
                self.managementPolicy == 'Observe'
                || (has(self.encryption) && has(self.group)
                  && ((self.encryption.exists(e, !e.startsWith('aes-gcm'))
                    && has(self.integrity) && size(self.integrity) > 0)
                  || (self.encryption.exists(e, e.startsWith('aes-gcm'))
                    && has(self.prf) && size(self.prf) > 0)))
              message: >-
                to write, a proposal needs encryption and group, a non-GCM
                cipher an integrity algorithm, and a GCM cipher a PRF
            properties:
              managementPolicy:
                type: string
                description: >-
                  Observe reads the proposal on the router; Merge writes the
                  fields of the spec; Replace makes the proposal the spec,
                  and removes it with the object.
                enum: [Observe, Merge, Replace]
                default: Observe
              deviceRef:
                type: object
                description: A Device in the proposal's namespace.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: deviceRef cannot change
                properties:
                  name:
                    type: string
                    minLength: 1
                required:
                - name
              after:
                type: array
                description: >-
                  Objects in the proposal's namespace that are Ready before the
                  proposal is applied.
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [kind, name]
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum: [Ikev2Proposal, Ikev2Policy, Ikev2Keyring, Ikev2Profile, IpsecTransformSet, IpsecProfile, TunnelInterface]
                    name:
                      type: string
                      minLength: 1
                  required:
                  - kind
                  - name
              name:
                type: string
                description: Name of the proposal on the router.
                minLength: 1
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: name cannot change
              encryption:
                type: array
                minItems: 1
                maxItems: 5
                x-kubernetes-list-type: set
                items:
                  type: string
                  maxLength: 11
                  enum: [aes-cbc-128, aes-cbc-192, aes-cbc-256, aes-gcm-128, aes-gcm-256]
              integrity:
                type: array
                maxItems: 5
                x-kubernetes-list-type: set
                items:
                  type: string
                  enum: [md5, sha1, sha256, sha384, sha512]
              prf:
                type: array
                maxItems: 5
                x-kubernetes-list-type: set
                items:
                  type: string
                  enum: [md5, sha1, sha256, sha384, sha512]
              group:
                type: array
                description: Diffie-Hellman groups.
                minItems: 1
                maxItems: 10
                x-kubernetes-list-type: set
                items:
                  type: integer
                  enum: [1, 2, 5, 14, 15, 16, 19, 20, 21, 24]
            required:
            - deviceRef
            - name
          status:
            type: object
            properties:
              wantsName:
                type: string
                description: The name the object needs, when it has another.
              observed:
                type: object
                description: The proposal on the router, in the shape of the spec.
                properties:
                  encryption:
                    type: array
                    items:
                      type: string
                  integrity:
                    type: array
                    items:
                      type: string
                  prf:
                    type: array
                    items:
                      type: string
                  group:
                    type: array
                    items:
                      type: integer
              drift:
                type: array
                description: Fields whose values in the spec the router lacks.
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    device:
                      type: array
                      items:
                        type: string
                    spec:
                      type: array
                      items:
                        type: string
              extra:
                type: array
                description: >-
                  Values the router has beyond the spec, in the fields the spec
                  sets; in Replace, in every field.
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    device:
                      type: array
                      items:
                        type: string
              reverted:
                type: object
                description: The drift and extra values the last write put back.
                properties:
                  time:
                    type: string
                  drift:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        device:
                          type: array
                          items:
                            type: string
                        spec:
                          type: array
                          items:
                            type: string
                  extra:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        device:
                          type: array
                          items:
                            type: string
