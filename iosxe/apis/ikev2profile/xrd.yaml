apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: ikev2profiles.iosxe.netclab.dev
spec:
  scope: Namespaced
  group: iosxe.netclab.dev
  names:
    kind: Ikev2Profile
    plural: ikev2profiles
    categories:
    - crossplane
    - netclab
  defaultCompositionRef:
    name: ikev2profiles.iosxe.netclab.dev
  versions:
  - name: v1alpha1
    additionalPrinterColumns:
    - name: DEVICE
      type: string
      jsonPath: .spec.deviceRef.name
    - name: PROFILE
      type: string
      jsonPath: .spec.name
    - name: MODE
      type: string
      jsonPath: .spec.managementPolicy
    - name: WANTS-NAME
      type: string
      jsonPath: .status.wantsName
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            # A thin object (deviceRef and name) only observes.
            x-kubernetes-validations:
            - rule: >-
                self.managementPolicy == 'Observe'
                || (has(self.remoteAddresses) && has(self.keyring))
              message: to write, a profile needs remoteAddresses and keyring
            properties:
              managementPolicy:
                type: string
                description: >-
                  Observe reads the profile on the router; Manage writes the
                  fields of the spec; FullControl makes the profile the spec, and
                  removes it with the object.
                enum: [Observe, Manage, FullControl]
                default: Observe
              deviceRef:
                type: object
                description: A Device in the profile's namespace.
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: deviceRef cannot change
                properties:
                  name:
                    type: string
                    minLength: 1
                required:
                - name
              after:
                type: array
                description: >-
                  Objects in the profile's namespace that are Ready before the
                  profile is applied.
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [kind, name]
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum: [Ikev2Proposal, Ikev2Policy, Ikev2Keyring, Ikev2Profile, IpsecTransformSet, IpsecProfile, TunnelInterface]
                    name:
                      type: string
                      minLength: 1
                  required:
                  - kind
                  - name
              name:
                type: string
                description: Name of the profile on the router.
                minLength: 1
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: name cannot change
              remoteAddresses:
                type: array
                description: IPv4 addresses of the peers the profile matches, one host each.
                minItems: 1
                x-kubernetes-list-type: set
                items:
                  type: string
                  format: ipv4
              keyring:
                type: string
                description: >-
                  Name of the IKEv2 keyring on the router that holds the
                  pre-shared keys. The profile authenticates with pre-shared keys
                  both ways, the one method of this version.
                minLength: 1
              ppkKeyring:
                type: string
                description: Name of the IKEv2 keyring on the router that holds the post-quantum preshared keys.
                minLength: 1
            required:
            - deviceRef
            - name
          status:
            type: object
            properties:
              wantsName:
                type: string
                description: The name the object needs, when it has another.
              observed:
                type: object
                description: >-
                  The profile on the router, in the shape of the spec. On IOS XE
                  17.18 no read returns `keyring ppk`, so ppkKeyring is shown only
                  where the package wrote it.
                properties:
                  remoteAddresses:
                    type: array
                    items:
                      type: string
                  keyring:
                    type: string
                  ppkKeyring:
                    type: string
              drift:
                type: array
                description: Fields whose values in the spec the router lacks.
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    device:
                      type: array
                      items:
                        type: string
                    spec:
                      type: array
                      items:
                        type: string
              extra:
                type: array
                description: >-
                  Values the router has beyond the spec, in the fields the spec
                  sets; in FullControl, in every field, a field the spec cannot
                  hold, such as description, given as JSON.
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    device:
                      type: array
                      items:
                        type: string
              reverted:
                type: object
                description: The drift and extra values the last write put back.
                properties:
                  time:
                    type: string
                  drift:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        device:
                          type: array
                          items:
                            type: string
                        spec:
                          type: array
                          items:
                            type: string
                  extra:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        device:
                          type: array
                          items:
                            type: string
