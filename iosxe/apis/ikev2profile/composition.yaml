apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: ikev2profiles.iosxe.netclab.dev
spec:
  compositeTypeRef:
    apiVersion: iosxe.netclab.dev/v1alpha1
    kind: Ikev2Profile
  mode: Pipeline
  pipeline:
  # One Request owns the profile over RESTCONF, with pre-shared keys both ways,
  # the one method of this version. Observe only reads; Manage PATCHes the
  # fields of the spec, a merge; FullControl PUTs the profile and DELETEs it with
  # the object. Lines the spec has no field for, such as description, are beyond
  # the spec, and FullControl takes them off.
  # `keyring ppk` is outside 17.18's YANG and no read returns it, so the package
  # keeps a mark of the line it wrote in an EEM variable, which one Request reads
  # in every mode. In Manage and FullControl another writes the line and the mark
  # over cli-rpc, once the profile's Request is Ready, and clears the peers' SAs
  # only when it replaces a mark of its own: taking over a profile changes
  # nothing in its traffic. The XR is not Ready until the mark is there, so what
  # waits on the profile in `after` comes up with the line in place. In
  # FullControl a Usage holds back the profile's DELETE until the line is removed.
  # The status is the last GET in the shape of the spec; Ready means the mode's
  # writes would change nothing.
  # Once every object in `after` is Ready the Requests are composed, and they
  # stay composed whatever happens to those objects; until then none is, and the
  # XR is not Ready, where Crossplane would call an XR composing nothing Ready. A
  # Usage of each object in `after` holds back its delete until this XR is gone.
  - step: requests
    functionRef:
      name: crossplane-contrib-function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource }}
          {{- $ns := $xr.metadata.namespace }}
          {{- $after := default (list) $xr.spec.after }}
          {{- $observed := default (dict) .observed.resources }}
          {{- $policy := $xr.spec.managementPolicy | default "Observe" }}
          {{- $old := default (dict) $xr.status }}
          {{- /* <device>--<slug>--<8 hex>, at most 63 characters */}}
          {{- $device := $xr.spec.deviceRef.name }}
          {{- $slug := regexReplaceAll "[^a-z0-9]+" (lower $xr.spec.name) "-" | trimAll "-" }}
          {{- $slug = trunc (int (max 0 (sub 51 (len $device)))) $slug | trimSuffix "-" }}
          {{- $want := printf "%s--%s--%s" $device $slug (sha256sum $xr.spec.name | trunc 8) }}
          {{- if ne $xr.metadata.name $want }}
          ---
          apiVersion: {{ $xr.apiVersion }}
          kind: {{ $xr.kind }}
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/ready: "False"
          status:
            wantsName: {{ $want }}
          {{- else }}
          ---
          apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
          kind: ExtraResources
          requirements:
            device:
              apiVersion: iosxe.netclab.dev/v1alpha1
              kind: Device
              matchName: {{ $device }}
              namespace: {{ $ns }}
            {{- range $i, $a := $after }}
            after-{{ $i }}:
              apiVersion: iosxe.netclab.dev/v1alpha1
              kind: {{ $a.kind }}
              matchName: {{ $a.name }}
              namespace: {{ $ns }}
            {{- end }}
          {{- $extra := default (dict) .extraResources }}
          {{- $waiting := false }}
          {{- range $i, $a := $after }}
          {{- $ready := false }}
          {{- with index $extra (printf "after-%d" $i) }}{{ with .items }}
          {{- range (index . 0).resource.status.conditions }}
          {{- if and (eq .type "Ready") (eq .status "True") }}{{ $ready = true }}{{ end }}
          {{- end }}
          ---
          apiVersion: protection.crossplane.io/v1beta1
          kind: Usage
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: after-{{ lower $a.kind }}-{{ $a.name }}
          spec:
            of:
              apiVersion: iosxe.netclab.dev/v1alpha1
              kind: {{ $a.kind }}
              resourceRef:
                name: {{ $a.name }}
            by:
              apiVersion: {{ $xr.apiVersion }}
              kind: {{ $xr.kind }}
              resourceRef:
                name: {{ $xr.metadata.name }}
            replayDeletion: true
          {{- end }}{{ end }}
          {{- if not $ready }}{{ $waiting = true }}{{ end }}
          {{- end }}
          {{- $hold := and $waiting (not (hasKey $observed "profile")) }}
          {{- $mine := sortAlpha (default list $xr.spec.remoteAddresses) }}
          {{- $ring := $xr.spec.keyring | default "" }}
          {{- $ppk := $xr.spec.ppkKeyring | default "" }}
          {{- $rewrite := index (default (dict) $xr.metadata.annotations) "iosxe.netclab.dev/rewrite-keys" | default "" }}
          {{- /* the mark of the PPK keyring the spec names; the name in clear after the place */}}
          {{- $place := printf "Ikev2Profile/%s/ppk" $xr.spec.name }}
          {{- $var := printf "netclab-%s" (sha256sum $place | trunc 8) }}
          {{- $mark := "" }}
          {{- if $ppk }}{{ $mark = sha256sum (ternary (printf "%s/%s" $ppk $rewrite) $ppk (ne $rewrite "")) | trunc 8 }}{{ end }}
          {{- /* the mark on the router, as the read last found it */}}
          {{- $found := list }}
          {{- with index $observed "ppk-mark" }}{{ with .resource.status }}{{ with .response }}
          {{- if eq (int (.statusCode | default 0)) 200 }}
          {{- $found = splitList " " (index (index (fromYaml .body) "Cisco-IOS-XE-eem:environment") 0 "value") }}
          {{- end }}
          {{- end }}{{ end }}{{ end }}
          {{- $foundMark := "" }}{{ if $found }}{{ $foundMark = index $found 0 }}{{ end }}
          {{- $foundRing := "" }}{{ if gt (len $found) 2 }}{{ $foundRing = index $found 2 }}{{ end }}
          {{- if not $hold }}
          {{- with .extraResources }}{{ with index . "device" }}{{ with .items }}
          {{- $dev := (index . 0).resource }}
          {{- $cred := $dev.spec.credentialsSecretRef }}
          {{- $auth := printf "{{ %s:%s:%s }}" $cred.name $ns $cred.key }}
          {{- $native := printf "https://%s/restconf/data/Cisco-IOS-XE-native:native" $dev.spec.address }}
          {{- $url := printf "%s/crypto/Cisco-IOS-XE-crypto:ikev2/profile=%s" $native $xr.spec.name }}
          {{- $env := printf "%s/event/Cisco-IOS-XE-eem:manager/environment=%s" $native $var }}
          {{- $rpc := printf "https://%s/restconf/operations/Cisco-IOS-XE-cli-rpc:config-ios-cli-rpc" $dev.spec.address }}
          {{- $ipv4 := list }}
          {{- range $mine }}{{ $ipv4 = append $ipv4 (dict "ipv4-address" . "ipv4-mask" "255.255.255.255") }}{{ end }}
          {{- $profile := dict "name" $xr.spec.name "authentication" (dict "local" (dict "pre-share" (dict)) "remote" (dict "pre-share" (dict))) }}
          {{- if $ring }}{{ $_ := set $profile "keyring" (dict "local" (dict "name" $ring)) }}{{ end }}
          {{- if $ipv4 }}{{ $_ := set $profile "match" (dict "identity" (dict "remote" (dict "address" (dict "ipv4" $ipv4)))) }}{{ end }}
          {{- $put := dict "Cisco-IOS-XE-crypto:profile" (list $profile) }}
          {{- /* a merge on native, which exists, creates the profile if it does not */}}
          {{- $patch := dict "Cisco-IOS-XE-native:native" (dict "crypto" (dict "Cisco-IOS-XE-crypto:ikev2" (dict "profile" (list $profile)))) }}
          ---
          apiVersion: http.m.crossplane.io/v1alpha2
          kind: Request
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: profile
          spec:
            {{- if eq $policy "Observe" }}
            managementPolicies: ["Observe"]
            {{- else if eq $policy "Manage" }}
            managementPolicies: ["Observe", "Create", "Update"]
            {{- else }}
            managementPolicies: ["*"]
            {{- end }}
            forProvider:
              insecureSkipTLSVerify: {{ $dev.spec.insecureSkipTLSVerify }}
              headers:
                Accept: ["application/yang-data+json"]
                Content-Type: ["application/yang-data+json"]
                Authorization: ["Basic {{ $auth }}"]
              payload:
                baseUrl: {{ $url | quote }}
                body: {{ (ternary $put $patch (eq $policy "FullControl")) | toJson | quote }}
              mappings:
              - action: OBSERVE
                method: GET
                url: .payload.baseUrl
              {{- if eq $policy "Manage" }}
              - action: CREATE
                method: PATCH
                url: {{ $native | quote | quote }}
                body: .payload.body
              - action: UPDATE
                method: PATCH
                url: {{ $native | quote | quote }}
                body: .payload.body
              {{- else if eq $policy "FullControl" }}
              - action: CREATE
                method: PUT
                url: .payload.baseUrl
                body: .payload.body
              - action: UPDATE
                method: PUT
                url: .payload.baseUrl
                body: .payload.body
              - action: REMOVE
                method: DELETE
                url: .payload.baseUrl
              {{- end }}
              # The router returns a host's mask after some writes and leaves it
              # out after others, and orders the addresses by number.
              expectedResponseCheck:
                type: CUSTOM
                logic: |
                  if .response.statusCode != 200 then false else
                    .response.body["Cisco-IOS-XE-crypto:profile"][0] as $p
                  {{- if eq $policy "FullControl" }}
                    | ($p | .match.identity.remote.address.ipv4 |= (. // [] | map(.["ipv4-mask"] //= "255.255.255.255")
                        | sort_by(.["ipv4-address"])))
                      == {{ $profile | toJson }}
                  {{- else }}
                    | {{ $mine | toJson }} - [$p.match.identity.remote.address.ipv4[]? | .["ipv4-address"]] == []
                    {{- if $ring }} and $p.keyring.local.name == {{ $ring | toJson }}{{ end }}
                    {{- if eq $policy "Manage" }}
                      and ($p.authentication.local // {} | has("pre-share")) and ($p.authentication.remote // {} | has("pre-share"))
                    {{- end }}
                  {{- end }}
                  end
          ---
          apiVersion: http.m.crossplane.io/v1alpha2
          kind: Request
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ppk-mark
              gotemplating.fn.crossplane.io/ready: "True"
          spec:
            managementPolicies: ["Observe"]
            forProvider:
              insecureSkipTLSVerify: {{ $dev.spec.insecureSkipTLSVerify }}
              headers:
                Accept: ["application/yang-data+json"]
                Authorization: ["Basic {{ $auth }}"]
              payload:
                baseUrl: {{ $env | quote }}
              mappings:
              - action: OBSERVE
                method: GET
                url: .payload.baseUrl
          {{- $profileReady := false }}
          {{- with index $observed "profile" }}
          {{- range .resource.status.conditions }}
          {{- if and (eq .type "Ready") (eq .status "True") }}{{ $profileReady = true }}{{ end }}
          {{- end }}
          {{- end }}
          {{- if and $ppk (ne $policy "Observe") (or $profileReady (hasKey $observed "ppk")) }}
          {{- $clear := list }}
          {{- /* a live SA goes on without the line until it is cleared; only a change of the package's own line clears it */}}
          {{- if and $foundMark (ne $foundMark $mark) }}
          {{- range $mine }}{{ $clear = append $clear (printf "\ndo clear crypto ikev2 sa remote %s" .) }}{{ end }}
          {{- end }}
          {{- $unclear := list }}
          {{- range $mine }}{{ $unclear = append $unclear (printf "\ndo clear crypto ikev2 sa remote %s" .) }}{{ end }}
          {{- $apply := printf "crypto ikev2 profile %s\n keyring ppk %s\n exit\nevent manager environment %s \"%s %s %s\"%s" $xr.spec.name $ppk $var $mark $place $ppk (join "" $clear) }}
          {{- $remove := printf "crypto ikev2 profile %s\n no keyring ppk\n exit\nno event manager environment %s%s" $xr.spec.name $var (join "" $unclear) }}
          ---
          apiVersion: http.m.crossplane.io/v1alpha2
          kind: Request
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: ppk
          spec:
            {{- if eq $policy "Manage" }}
            managementPolicies: ["Observe", "Create", "Update"]
            {{- else }}
            managementPolicies: ["*"]
            {{- end }}
            forProvider:
              insecureSkipTLSVerify: {{ $dev.spec.insecureSkipTLSVerify }}
              headers:
                Accept: ["application/yang-data+json"]
                Content-Type: ["application/yang-data+json"]
                Authorization: ["Basic {{ $auth }}"]
              payload:
                baseUrl: {{ $env | quote }}
                body: {{ dict "Cisco-IOS-XE-cli-rpc:input" (dict "config-clis" $apply) | toJson | quote }}
              mappings:
              - action: OBSERVE
                method: GET
                url: .payload.baseUrl
              - action: CREATE
                method: POST
                url: {{ $rpc | quote | quote }}
                body: .payload.body
              - action: UPDATE
                method: POST
                url: {{ $rpc | quote | quote }}
                body: .payload.body
              {{- if eq $policy "FullControl" }}
              - action: REMOVE
                method: POST
                url: {{ $rpc | quote | quote }}
                body: {{ dict "Cisco-IOS-XE-cli-rpc:input" (dict "config-clis" $remove) | toJson | quote }}
              {{- end }}
              isRemovedCheck:
                type: CUSTOM
                logic: .response.statusCode == 404
              expectedResponseCheck:
                type: CUSTOM
                logic: |
                  .response.statusCode == 200 and
                    ((.response.body["Cisco-IOS-XE-eem:environment"][0].value // "") | split(" ")[0]) == {{ $mark | quote }}
          {{- /* the line's removal enters the profile, which makes it again once deleted */}}
          {{- if and (eq $policy "FullControl") (hasKey $observed "profile") (hasKey $observed "ppk") }}
          ---
          apiVersion: protection.crossplane.io/v1beta1
          kind: Usage
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: profile-by-ppk
              gotemplating.fn.crossplane.io/ready: "True"
          spec:
            of:
              apiVersion: http.m.crossplane.io/v1alpha2
              kind: Request
              resourceRef:
                name: {{ (index $observed "profile").resource.metadata.name }}
            by:
              apiVersion: http.m.crossplane.io/v1alpha2
              kind: Request
              resourceRef:
                name: {{ (index $observed "ppk").resource.metadata.name }}
            replayDeletion: true
          {{- end }}
          {{- end }}
          {{- end }}{{ end }}{{ end }}
          {{- end }}
          {{- $status := dict }}
          {{- range $k := list "observed" "drift" "extra" "reverted" }}{{ if hasKey $old $k }}{{ $_ := set $status $k (index $old $k) }}{{ end }}{{ end }}
          {{- $present := hasKey $status "observed" }}
          {{- with index $observed "profile" }}
          {{- $rs := default (dict) .resource.status }}
          {{- $method := "" }}{{ with $rs.requestDetails }}{{ $method = .method | default "" }}{{ end }}
          {{- with $rs.response }}
          {{- $code := int (.statusCode | default 0) }}
          {{- if eq $method "GET" }}
            {{- if eq $code 200 }}
              {{- $p := index (index (fromYaml .body) "Cisco-IOS-XE-crypto:profile") 0 }}
              {{- $match := get $p "match" | default dict }}
              {{- $ipv4 := list }}
              {{- with get $match "identity" }}{{ with get . "remote" }}{{ with get . "address" }}{{ $ipv4 = get . "ipv4" | default list }}{{ end }}{{ end }}{{ end }}
              {{- $theirs := list }}{{ range $ipv4 }}{{ $theirs = append $theirs (index . "ipv4-address") }}{{ end }}
              {{- $theirs = sortAlpha $theirs }}
              {{- $keyring := get $p "keyring" | default dict }}
              {{- $their := "" }}{{ with get $keyring "local" }}{{ $their = get . "name" | default "" }}{{ end }}
              {{- $drift := list }}
              {{- $more := list }}
              {{- $missing := list }}{{ range $mine }}{{ if not (has . $theirs) }}{{ $missing = append $missing . }}{{ end }}{{ end }}
              {{- if $missing }}{{ $drift = append $drift (dict "field" "remoteAddresses" "device" $theirs "spec" $mine) }}{{ end }}
              {{- if or $mine (eq $policy "FullControl") }}
                {{- $beyond := list }}{{ range $theirs }}{{ if not (has . $mine) }}{{ $beyond = append $beyond . }}{{ end }}{{ end }}
                {{- if $beyond }}{{ $more = append $more (dict "field" "remoteAddresses" "device" $beyond) }}{{ end }}
              {{- end }}
              {{- $theirRing := ternary (list $their) list (ne $their "") }}
              {{- if $ring }}
                {{- if ne $their $ring }}{{ $drift = append $drift (dict "field" "keyring" "device" $theirRing "spec" (list $ring)) }}{{ end }}
              {{- else if and (eq $policy "FullControl") $their }}
                {{- $more = append $more (dict "field" "keyring" "device" $theirRing) }}
              {{- end }}
              {{- if eq $policy "FullControl" }}
                {{- $preshare := dict "local" (dict "pre-share" (dict)) "remote" (dict "pre-share" (dict)) }}
                {{- if ne (get $p "authentication" | default dict | toJson) ($preshare | toJson) }}{{ $more = append $more (dict "field" "authentication" "device" (list (get $p "authentication" | default dict | toJson))) }}{{ end }}
                {{- range $k, $v := $keyring }}{{ if ne $k "local" }}{{ $more = append $more (dict "field" $k "device" (list (toJson $v))) }}{{ end }}{{ end }}
                {{- /* match beyond identity remote address, empty maps pruned */}}
                {{- $rest := deepCopy $match }}
                {{- with get $rest "identity" }}
                  {{- with get . "remote" }}{{ $_ := unset . "address" }}{{ end }}
                  {{- if not (get . "remote") }}{{ $_ := unset . "remote" }}{{ end }}
                {{- end }}
                {{- if not (get $rest "identity") }}{{ $_ := unset $rest "identity" }}{{ end }}
                {{- if $rest }}{{ $more = append $more (dict "field" "match" "device" (list (toJson $rest))) }}{{ end }}
                {{- range $k, $v := $p }}{{ if not (has $k (list "name" "authentication" "keyring" "match")) }}{{ $more = append $more (dict "field" $k "device" (list (toJson $v))) }}{{ end }}{{ end }}
              {{- end }}
              {{- $seen := dict }}
              {{- if $theirs }}{{ $_ := set $seen "remoteAddresses" $theirs }}{{ end }}
              {{- if $their }}{{ $_ := set $seen "keyring" $their }}{{ end }}
              {{- $_ := set $status "observed" $seen }}
              {{- $_ := set $status "drift" $drift }}
              {{- $_ := set $status "extra" $more }}
              {{- $present = true }}
            {{- else }}
              {{- $_ := unset $status "observed" }}
              {{- $_ := set $status "drift" list }}
              {{- $_ := set $status "extra" list }}
              {{- $present = false }}
            {{- end }}
          {{- else if and $method (ge $code 200) (lt $code 300) }}
            {{- /* after a write that succeeded the response is still the GET before it: the router has the spec, the next GET shows it */}}
            {{- $undid := dict "drift" list "extra" list }}
            {{- range default list $old.drift }}{{ if ne .field "ppkKeyring" }}{{ $_ := set $undid "drift" (append $undid.drift .) }}{{ end }}{{ end }}
            {{- if eq $policy "FullControl" }}{{ range default list $old.extra }}{{ if ne .field "ppkKeyring" }}{{ $_ := set $undid "extra" (append $undid.extra .) }}{{ end }}{{ end }}{{ end }}
            {{- if or $undid.drift $undid.extra }}
              {{- $_ := set $undid "time" (dateInZone "2006-01-02T15:04:05Z" (now) "UTC") }}
              {{- $_ := set $status "reverted" $undid }}
            {{- end }}
            {{- $_ := set $status "drift" list }}
            {{- if eq $policy "FullControl" }}{{ $_ := set $status "extra" list }}{{ end }}
            {{- $present = true }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- /* the PPK keyring, from the mark: in place of what the status had of it */}}
          {{- if $present }}
            {{- $seen := omit (get $status "observed" | default dict) "ppkKeyring" }}
            {{- if $foundRing }}{{ $_ := set $seen "ppkKeyring" $foundRing }}{{ end }}
            {{- $_ := set $status "observed" $seen }}
            {{- $drift := list }}{{ range get $status "drift" | default list }}{{ if ne .field "ppkKeyring" }}{{ $drift = append $drift . }}{{ end }}{{ end }}
            {{- $more := list }}{{ range get $status "extra" | default list }}{{ if ne .field "ppkKeyring" }}{{ $more = append $more . }}{{ end }}{{ end }}
            {{- $theirPpk := ternary (list $foundRing) list (ne $foundRing "") }}
            {{- if $ppk }}
              {{- if ne $foundRing $ppk }}{{ $drift = append $drift (dict "field" "ppkKeyring" "device" $theirPpk "spec" (list $ppk)) }}{{ end }}
            {{- else if and (eq $policy "FullControl") $foundRing }}
              {{- $more = append $more (dict "field" "ppkKeyring" "device" $theirPpk) }}
            {{- end }}
            {{- $_ := set $status "drift" $drift }}
            {{- $_ := set $status "extra" $more }}
          {{- end }}
          {{- $marked := or (not $ppk) (eq $policy "Observe") (eq $foundMark $mark) }}
          {{- $ready := and $present $marked (not $status.drift) (or (ne $policy "FullControl") (not $status.extra)) }}
          ---
          apiVersion: {{ $xr.apiVersion }}
          kind: {{ $xr.kind }}
          {{- if or $hold (not $ready) }}
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/ready: "False"
          {{- end }}
          status: {{ $status | toJson }}
          {{- end }}

  - step: auto-ready
    functionRef:
      name: crossplane-contrib-function-auto-ready
