apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: devices.iosxe.netclab.dev
spec:
  scope: Namespaced
  group: iosxe.netclab.dev
  names:
    kind: Device
    plural: devices
    categories:
    - crossplane
    - netclab
  defaultCompositionRef:
    name: devices.iosxe.netclab.dev
  versions:
  - name: v1alpha1
    additionalPrinterColumns:
    - name: ADDRESS
      type: string
      jsonPath: .spec.address
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        # Each object's name starts with its Device's and two dashes, and fits
        # the 63 characters of a Kubernetes name.
        x-kubernetes-validations:
        - rule: size(self.metadata.name) <= 31 && !self.metadata.name.contains('--')
          message: a Device name has at most 31 characters and no --
        properties:
          spec:
            type: object
            properties:
              address:
                type: string
                description: Host or host:port of the router's RESTCONF, over https.
                minLength: 1
              insecureSkipTLSVerify:
                type: boolean
                default: false
              credentialsSecretRef:
                type: object
                description: >-
                  A Secret in the Device's namespace; the key holds base64 of
                  user:password.
                properties:
                  name:
                    type: string
                    minLength: 1
                  key:
                    type: string
                    minLength: 1
                required:
                - name
                - key
            required:
            - address
            - credentialsSecretRef
          status:
            type: object
            properties:
              config:
                type: array
                description: >-
                  The router's sections of the package's kinds, as of the last
                  poll, each with the name its object must have and whether that
                  object is in the namespace.
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                      description: The section's name on the router.
                    xr:
                      type: string
                      description: The name the section's object must have.
                    exists:
                      type: boolean
                      description: Whether an object of that name for this Device is in the namespace.
              vrfs:
                type: array
                description: >-
                  The names of the router's VRFs, of vrf definition and ip vrf, as
                  of the last poll.
                items:
                  type: string
