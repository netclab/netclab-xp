apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: devices.iosxe.netclab.dev
spec:
  scope: Namespaced
  group: iosxe.netclab.dev
  names:
    kind: Device
    plural: devices
    categories:
    - crossplane
    - netclab
  defaultCompositionRef:
    name: devices.iosxe.netclab.dev
  versions:
  - name: v1alpha1
    additionalPrinterColumns:
    - name: ADDRESS
      type: string
      jsonPath: .spec.address
    - name: CONFIG
      type: string
      jsonPath: .status.config
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              address:
                type: string
                description: Host or host:port of the router's RESTCONF, over https.
                minLength: 1
              insecureSkipTLSVerify:
                type: boolean
                default: false
              credentialsSecretRef:
                type: object
                description: >-
                  A Secret in the Device's namespace; the key holds base64 of
                  user:password.
                properties:
                  name:
                    type: string
                    minLength: 1
                  key:
                    type: string
                    minLength: 1
                required:
                - name
                - key
              config:
                type: array
                description: >-
                  The router's objects in the order they are applied: each is composed as an XR of its kind,
                  with this Device as its deviceRef, once every one above it is Ready.
                maxItems: 64
                items:
                  type: object
                  description: One object of the router, under the name of its kind.
                  properties:
                    ikev2Proposal:
                      type: object
                      description: The fields of the spec of Ikev2Proposal but deviceRef.
                      x-kubernetes-validations:
                      - rule: >-
                          (self.encryption.exists(e, !e.startsWith('aes-gcm'))
                            && has(self.integrity) && size(self.integrity) > 0)
                          || (self.encryption.exists(e, e.startsWith('aes-gcm'))
                            && has(self.prf) && size(self.prf) > 0)
                        message: >-
                          a non-GCM cipher needs an integrity algorithm, a GCM cipher needs a PRF
                      properties:
                        name:
                          type: string
                          description: Name of the proposal on the router.
                          minLength: 1
                        encryption:
                          type: array
                          minItems: 1
                          maxItems: 7
                          x-kubernetes-list-type: set
                          items:
                            type: string
                            maxLength: 11
                            enum:
                            - 3des
                            - des
                            - aes-cbc-128
                            - aes-cbc-192
                            - aes-cbc-256
                            - aes-gcm-128
                            - aes-gcm-256
                        integrity:
                          type: array
                          maxItems: 5
                          x-kubernetes-list-type: set
                          items:
                            type: string
                            enum:
                            - md5
                            - sha1
                            - sha256
                            - sha384
                            - sha512
                        prf:
                          type: array
                          maxItems: 5
                          x-kubernetes-list-type: set
                          items:
                            type: string
                            enum:
                            - md5
                            - sha1
                            - sha256
                            - sha384
                            - sha512
                        group:
                          type: array
                          description: Diffie-Hellman groups.
                          minItems: 1
                          maxItems: 10
                          x-kubernetes-list-type: set
                          items:
                            type: integer
                            enum:
                            - 1
                            - 2
                            - 5
                            - 14
                            - 15
                            - 16
                            - 19
                            - 20
                            - 21
                            - 24
                      required:
                      - name
                      - encryption
                      - group
                    ikev2Policy:
                      type: object
                      description: The fields of the spec of Ikev2Policy but deviceRef.
                      properties:
                        name:
                          type: string
                          description: Name of the policy on the router.
                          minLength: 1
                        proposals:
                          type: array
                          description: Names of IKEv2 proposals on the router, or `default`.
                          minItems: 1
                          x-kubernetes-list-type: set
                          items:
                            type: string
                            minLength: 1
                      required:
                      - name
                      - proposals
                    ikev2Keyring:
                      type: object
                      description: The fields of the spec of Ikev2Keyring but deviceRef.
                      properties:
                        name:
                          type: string
                          description: Name of the keyring on the router.
                          minLength: 1
                        peers:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                minLength: 1
                              address:
                                type: string
                                description: IPv4 address of the peer.
                                format: ipv4
                              preSharedKeySecretRef:
                                type: object
                                description: A Secret in the keyring's namespace; the key holds the pre-shared
                                  key.
                                properties:
                                  name:
                                    type: string
                                    minLength: 1
                                  key:
                                    type: string
                                    minLength: 1
                                required:
                                - name
                                - key
                              ppk:
                                type: object
                                description: >-
                                  Manual post-quantum pre-shared key (RFC 8784), always required: the tunnel
                                  does not come up without it. A new key goes with a new id; a key changed
                                  under the same id is not applied.
                                properties:
                                  id:
                                    type: string
                                    minLength: 1
                                  keySecretRef:
                                    type: object
                                    description: >-
                                      A Secret in the keyring's namespace; the key holds the PPK as hex
                                      of printable ASCII characters.
                                    properties:
                                      name:
                                        type: string
                                        minLength: 1
                                      key:
                                        type: string
                                        minLength: 1
                                    required:
                                    - name
                                    - key
                                required:
                                - id
                                - keySecretRef
                            required:
                            - name
                            - address
                            - preSharedKeySecretRef
                      required:
                      - name
                      - peers
                    ikev2Profile:
                      type: object
                      description: The fields of the spec of Ikev2Profile but deviceRef.
                      properties:
                        name:
                          type: string
                          description: Name of the profile on the router.
                          minLength: 1
                        remoteAddresses:
                          type: array
                          description: IPv4 addresses of the peers the profile matches, one host each.
                          minItems: 1
                          x-kubernetes-list-type: set
                          items:
                            type: string
                            format: ipv4
                        keyring:
                          type: string
                          description: >-
                            Name of the IKEv2 keyring on the router that holds the pre-shared keys.
                          minLength: 1
                        ppkKeyring:
                          type: string
                          description: >-
                            Name of the IKEv2 keyring on the router that holds the post-quantum preshared
                            keys.
                          minLength: 1
                      required:
                      - name
                      - remoteAddresses
                      - keyring
                    ipsecTransformSet:
                      type: object
                      description: The fields of the spec of IpsecTransformSet but deviceRef.
                      x-kubernetes-validations:
                      - rule: '!has(self.keyBits) || self.esp in [''esp-aes'', ''esp-gcm'', ''esp-gmac'']'
                        message: keyBits goes only with esp-aes, esp-gcm and esp-gmac
                      - rule: '!has(self.espHmac) || !(self.esp in [''esp-gcm'', ''esp-gmac''])'
                        message: esp-gcm and esp-gmac carry their own integrity, so no espHmac
                      properties:
                        name:
                          type: string
                          description: Name (tag) of the transform-set on the router.
                          minLength: 1
                        esp:
                          type: string
                          description: ESP encryption transform.
                          enum:
                          - esp-3des
                          - esp-aes
                          - esp-des
                          - esp-gcm
                          - esp-gmac
                          - esp-null
                          - esp-seal
                          - esp-192-aes
                          - esp-256-aes
                        keyBits:
                          type: integer
                          description: >-
                            Key length of esp-aes, esp-gcm or esp-gmac; the router's default is 128.
                          enum:
                          - 128
                          - 192
                          - 256
                        espHmac:
                          type: string
                          description: ESP integrity transform.
                          enum:
                          - esp-md5-hmac
                          - esp-sha-hmac
                          - esp-sha256-hmac
                          - esp-sha384-hmac
                          - esp-sha512-hmac
                        mode:
                          type: string
                          description: Encapsulation mode.
                          enum:
                          - tunnel
                          - transport
                          default: tunnel
                      required:
                      - name
                      - esp
                    ipsecProfile:
                      type: object
                      description: The fields of the spec of IpsecProfile but deviceRef.
                      properties:
                        name:
                          type: string
                          description: Name of the IPsec profile on the router.
                          minLength: 1
                        transformSets:
                          type: array
                          description: Names (tags) of IPsec transform-sets on the router.
                          minItems: 1
                          maxItems: 6
                          x-kubernetes-list-type: set
                          items:
                            type: string
                            minLength: 1
                        ikev2Profile:
                          type: string
                          description: Name of the IKEv2 profile on the router.
                          minLength: 1
                      required:
                      - name
                      - transformSets
                      - ikev2Profile
                    tunnelInterface:
                      type: object
                      description: The fields of the spec of TunnelInterface but deviceRef.
                      properties:
                        number:
                          type: integer
                          description: Number of the tunnel interface on the router, 0 for Tunnel0.
                          minimum: 0
                          maximum: 2147483647
                        mode:
                          type: string
                          description: Tunnel mode, `ipsec-ipv4` for `tunnel mode ipsec ipv4`.
                          enum:
                          - ipsec-ipv4
                        ipv4Address:
                          type: string
                          description: IPv4 address of the tunnel interface and its prefix length.
                          maxLength: 18
                          x-kubernetes-validations:
                          - rule: isCIDR(self) && cidr(self).ip().family() == 4
                            message: an IPv4 address and its prefix length, such as 192.168.100.1/24
                        source:
                          type: string
                          description: Interface, or IPv4 address, the tunnel's packets leave from.
                          minLength: 1
                        destination:
                          type: string
                          description: IPv4 address of the far end of the tunnel.
                          format: ipv4
                        ipsecProfile:
                          type: string
                          description: Name of the IPsec profile on the router that protects the tunnel.
                          minLength: 1
                      required:
                      - number
                      - mode
                      - ipv4Address
                      - source
                      - destination
                      - ipsecProfile
                  x-kubernetes-validations:
                  - rule: >-
                      [has(self.ikev2Proposal), has(self.ikev2Policy), has(self.ikev2Keyring), has(self.ikev2Profile),
                      has(self.ipsecTransformSet), has(self.ipsecProfile), has(self.tunnelInterface)].filter(x,
                      x).size() == 1
                    message: >-
                      exactly one of ikev2Proposal, ikev2Policy, ikev2Keyring, ikev2Profile, ipsecTransformSet,
                      ipsecProfile, tunnelInterface
            required:
            - address
            - credentialsSecretRef
          status:
            type: object
            properties:
              config:
                type: string
                description: How many objects of spec.config are Ready, of how many, such as 3/7.
