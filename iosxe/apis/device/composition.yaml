apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: devices.iosxe.netclab.dev
spec:
  compositeTypeRef:
    apiVersion: iosxe.netclab.dev/v1alpha1
    kind: Device
  mode: Pipeline
  pipeline:
  # A Device configures nothing. Its first Request reads the hostname, so the
  # Device is Ready only when the router answers with these credentials. Two
  # more read the names of the router's blocks of the package's kinds, the
  # crypto ones in one GET and the tunnels in another; each is Ready once its GET
  # has answered, so a Ready Device has read every block. The status lists each
  # block with the name its object must have, and whether an object of that name
  # for this Device is in the namespace, once both reads have answered.
  - step: requests
    functionRef:
      name: crossplane-contrib-function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource }}
          {{- $ns := $xr.metadata.namespace }}
          {{- $device := $xr.metadata.name }}
          {{- $ref := $xr.spec.credentialsSecretRef }}
          {{- $auth := printf "{{ %s:%s:%s }}" $ref.name $ns $ref.key }}
          {{- $native := printf "https://%s/restconf/data/Cisco-IOS-XE-native:native" $xr.spec.address }}
          {{- $observed := default (dict) .observed.resources }}
          {{- $kinds := list "Ikev2Proposal" "Ikev2Policy" "Ikev2Keyring" "Ikev2Profile" "IpsecTransformSet" "IpsecProfile" "TunnelInterface" }}

          {{- /* ---- whether each read has answered ---- */}}
          {{- /* whether each read has answered; a 204 is a router with no such block */}}
          {{- $answered := dict }}
          {{- range $name := list "config" "tunnels" }}
            {{- $code := int (dig $name "resource" "status" "response" "statusCode" 0 $observed) }}
            {{- $_ := set $answered $name (or (eq $code 200) (eq $code 204)) }}
          {{- end }}

          {{- /* ---- what it requires, and the three Requests it reads the router with ---- */}}
          ---
          apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
          kind: ExtraResources
          requirements:
            {{- range $kinds }}
            {{ lower . }}:
              apiVersion: iosxe.netclab.dev/v1alpha1
              kind: {{ . }}
              matchLabels: {}
              namespace: {{ $ns }}
            {{- end }}
          {{- range $name, $url := dict
                "hostname" (printf "%s/hostname" $native)
                "config" (printf "%s/crypto?fields=Cisco-IOS-XE-crypto:ikev2(proposal/name;policy/name;keyring/name;profile/name);Cisco-IOS-XE-crypto:ipsec(transform-set/tag;profile/name)" $native)
                "tunnels" (printf "%s/interface?fields=Tunnel/name" $native) }}
          ---
          apiVersion: http.m.crossplane.io/v1alpha2
          kind: Request
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $name }}
              {{- if ne $name "hostname" }}
              gotemplating.fn.crossplane.io/ready: {{ if get $answered $name }}"True"{{ else }}"False"{{ end }}
              {{- end }}
          spec:
            managementPolicies: ["Observe"]
            forProvider:
              insecureSkipTLSVerify: {{ $xr.spec.insecureSkipTLSVerify }}
              headers:
                Accept: ["application/yang-data+json"]
                Authorization: ["Basic {{ $auth }}"]
              payload:
                baseUrl: {{ $url | quote }}
              mappings:
              - action: OBSERVE
                method: GET
                url: .payload.baseUrl
          {{- end }}

          {{- /* ---- its objects ---- */}}
          {{- /* the objects in the namespace for this Device, by kind */}}
          {{- $have := dict }}
          {{- $extra := default (dict) .extraResources }}
          {{- range $kinds }}
            {{- $names := list }}
            {{- with index $extra (lower .) }}{{ range .items }}
              {{- if eq .resource.spec.deviceRef.name $device }}{{ $names = append $names .resource.metadata.name }}{{ end }}
            {{- end }}{{ end }}
            {{- $_ := set $have . $names }}
          {{- end }}

          {{- /* ---- the router's blocks ---- */}}
          {{- /* the blocks on the router, by kind, as the last reads found them; a 204 is none */}}
          {{- $blocks := dict }}
          {{- with index $observed "config" }}{{ with .resource.status }}{{ with .response }}
          {{- $code := int (.statusCode | default 0) }}
          {{- if eq $code 200 }}
            {{- $crypto := get (fromYaml .body) "Cisco-IOS-XE-native:crypto" | default dict }}
            {{- $ikev2 := get $crypto "Cisco-IOS-XE-crypto:ikev2" | default dict }}
            {{- $ipsec := get $crypto "Cisco-IOS-XE-crypto:ipsec" | default dict }}
            {{- range $kind, $list := dict "Ikev2Proposal" (get $ikev2 "proposal") "Ikev2Policy" (get $ikev2 "policy") "Ikev2Keyring" (get $ikev2 "keyring") "Ikev2Profile" (get $ikev2 "profile") "IpsecProfile" (get $ipsec "profile") }}
              {{- $names := list }}{{ range ($list | default list) }}{{ $names = append $names .name }}{{ end }}
              {{- $_ := set $blocks $kind $names }}
            {{- end }}
            {{- $tags := list }}{{ range (get $ipsec "transform-set" | default list) }}{{ $tags = append $tags .tag }}{{ end }}
            {{- $_ := set $blocks "IpsecTransformSet" $tags }}
          {{- end }}
          {{- end }}{{ end }}{{ end }}
          {{- with index $observed "tunnels" }}{{ with .resource.status }}{{ with .response }}
          {{- $code := int (.statusCode | default 0) }}
          {{- if eq $code 200 }}
            {{- $names := list }}
            {{- with get (fromYaml .body) "Cisco-IOS-XE-native:interface" }}{{ range (get . "Tunnel" | default list) }}{{ $names = append $names (printf "Tunnel%v" .name) }}{{ end }}{{ end }}
            {{- $_ := set $blocks "TunnelInterface" $names }}
          {{- end }}
          {{- end }}{{ end }}{{ end }}

          {{- /* ---- the status: each block with the name of its object ---- */}}
          {{- if and (get $answered "config") (get $answered "tunnels") }}
          {{- $config := list }}
          {{- range $kind := $kinds }}
            {{- range (get $blocks $kind | default list) }}
              {{- /* <device>--<slug>--<8 hex>, at most 63 characters, as each kind's composition makes it */}}
              {{- $slug := regexReplaceAll "[^a-z0-9]+" (lower .) "-" | trimAll "-" }}
              {{- $slug = trunc (int (max 0 (sub 51 (len $device)))) $slug | trimSuffix "-" }}
              {{- $want := printf "%s--%s--%s" $device $slug (sha256sum . | trunc 8) }}
              {{- $config = append $config (dict "kind" $kind "name" . "xr" $want "exists" (has $want (get $have $kind))) }}
            {{- end }}
          {{- end }}
          ---
          apiVersion: {{ $xr.apiVersion }}
          kind: {{ $xr.kind }}
          status:
            config: {{ $config | toJson }}
          {{- end }}

  - step: auto-ready
    functionRef:
      name: crossplane-contrib-function-auto-ready
