apiVersion: iosxe.netclab.dev/v1alpha1
kind: Ikev2Keyring
metadata:
  name: r3-ikev2-keyring
spec:
  deviceRef:
    name: r3
  name: CLASSICAL-KEYRING
  peers:
  - name: R1
    address: 10.0.12.1
    preSharedKeySecretRef:
      name: ike-keys
      key: psk
    ppk:
      id: PPK-R1R3
      keySecretRef:
        name: ike-keys
        key: ppk-hex
