# The routers' credentials and the keys of part 9, in the namespace of the objects that
# name them. Lab values: replace them for anything that is not a throwaway lab.
#
# `basic` is the base64 token of the Authorization header, `cisco:cisco`; a Device names
# this Secret and key in credentialsSecretRef.
apiVersion: v1
kind: Secret
metadata:
  name: iosxe-creds
  namespace: lab
stringData:
  basic: Y2lzY286Y2lzY28=
---
# The IKEv2 preshared key, and the post-quantum preshared key as hex of ASCII characters,
# the only form the router accepts: "HelloPostQuartnum", as in part 9.
apiVersion: v1
kind: Secret
metadata:
  name: ike-keys
  namespace: lab
stringData:
  psk: TestPsk123
  ppk-hex: 48656C6C6F506F737451756172746E756D
