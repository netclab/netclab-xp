apiVersion: iosxe.netclab.dev/v1alpha1
kind: Ikev2Keyring
metadata:
  name: r1-ikev2-keyring
spec:
  deviceRef:
    name: r1
  name: TEST-KR
  peers:
  - name: R2
    address: 10.0.12.2
    preSharedKeySecretRef:
      name: ike-keys
      key: psk
    ppk:
      id: PPK-LAB
      keySecretRef:
        name: ike-keys
        key: ppk-hex
