site_name: netclab-xp
site_description: Declarative router configuration with Crossplane — layered APIs over RESTCONF, JSON-RPC and eAPI.
site_url: https://netclab.dev/netclab-xp/
site_author: Michal Bakalarski

repo_url: https://github.com/netclab/netclab-xp
repo_name: netclab/netclab-xp
edit_uri: edit/main/docs/

copyright: Apache-2.0 — Netclab Contributors

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Set up a lab: lab.md
      - Install the package: install.md
      - Your first resource: first-resource.md
  - Scenarios:
      - Overview: scenarios/index.md
      - RESTCONF: scenarios/restconf.md
      - JSON-RPC: scenarios/jsonrpc.md
      - eAPI: scenarios/eapi.md
      - Router: scenarios/router.md
      - Fabric: scenarios/fabric.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/netclab
      name: netclab on GitHub
