[project]
name = "function-aws-vpn"
version = "0"
description = "The decisions of configuration-aws-vpn's Connection"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "crossplane-function-sdk-python>=0.15.1",
]

[project.scripts]
aws-vpn-function = "function.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "function"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
