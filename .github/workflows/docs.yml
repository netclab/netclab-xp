name: Docs

# `mkdocs build --strict` fails on a broken link, so it runs on every pull request
# (a required check filtered by `paths` would never report); only pushes to main deploy.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: mkdocs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # Outside docs/, which mkdocs copies into the site.
      - name: Build the site
        run: |
          set -euo pipefail
          uv run --with-requirements requirements-docs.txt \
            mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy to Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # On the job, not the workflow: a PR's build in the same group would cancel a
    # pending deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    # The job only waits on Pages; deploy-pages' own limit is the real one.
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages waits at most 10 minutes whatever is passed, then cancels the
      # deployment of that commit: recovering takes a new commit, not a re-run.
      - id: deployment
        uses: actions/deploy-pages@v5
