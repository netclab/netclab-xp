name: CI

# Builds the Configuration package on every PR. Until now the only thing that
# ever built this repo was a script in a *private* repo, run by hand at release
# time -- so a broken XRD or composition was found after the tag, if at all.
#
# `crossplane xpkg build` is not a lint: it parses every YAML under
# --package-root and rejects anything that is not a valid Kubernetes manifest,
# and --examples-root puts the examples through the same check. So a green build
# is a real statement about every XRD, composition and example that ships --
# which is why it is the gate here and the first job of the release.
#
# The package root is `apis/`, and the meta file lives there with it -- xpkg
# requires the meta in the root it is given. This is what makes the build need
# no --ignore at all: it collects every .yml and .yaml under --package-root
# recursively, so with the repo root as package root, every workflow file,
# kustomize overlay and helm values file had to be excluded by a glob. Those
# globs were file-only and did not cross '/', so each nesting level needed its
# own -- meaning a new sub-directory anywhere silently required an edit in three
# places, and broke the build when it did not get one.
#
# Narrowing the root inverts that: anything outside apis/ is excluded by
# construction, and no directory added later can affect this build. Verified
# when it changed: the package is byte-identical to the one the globs produced.
#
# `examples/` is passed separately and is not collected here. Note --ignore
# never reached --examples-root either, so anything placed under examples/
# ships with no way to filter it -- which is why examples/ holds XR manifests
# and nothing else, and why the scenario overlays live outside it and reach in.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: xpkg build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install crossplane CLI
        run: |
          set -euo pipefail
          # XP_VERSION pins the CLI: install.sh otherwise takes whatever is
          # current, so this job would drift onto a different CLI with no commit.
          # renovate: datasource=github-releases depName=crossplane/crossplane
          curl -sfL "https://cli.crossplane.io/install.sh" | XP_VERSION=v2.4.0 sh
          sudo mv ./crossplane /usr/local/bin/crossplane
          crossplane version --client

      # Unversioned on purpose: CI only has to answer "does this build", and a
      # Configuration carries no version of its own -- the release tag supplies
      # it. See release.yml for the same command with a real version.
      - name: Build the package
        run: |
          set -euo pipefail
          crossplane xpkg build \
            --package-root=apis \
            --examples-root=./examples \
            -o netclab-xp-ci.xpkg

      # The install snippet used to carry a hard-coded tag that was hand-synced
      # with the release script -- and went stale every time someone forgot.
      # Now the git tag is the only version, and this keeps it that way.
      #
      # It covers docs/ as well as the README, because that is where the snippet
      # now lives. Guarding only the file the snippet used to be in is how this
      # check would quietly stop protecting anything.
      - name: Check no pinned version in README or docs
        run: |
          set -euo pipefail
          if grep -rn 'netclab-xp:v[0-9]' README.md docs/; then
            echo "::error::A netclab-xp version is pinned above. The git tag is" \
                 "the version; leave the install snippet's \${VERSION}" \
                 "placeholder alone."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: xpkg-ci
          path: netclab-xp-ci.xpkg
          if-no-files-found: error
          retention-days: 7
