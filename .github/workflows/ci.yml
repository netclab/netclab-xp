name: CI

# xpkg build parses every YAML under the package root and the examples, so a green
# build checks every XRD, composition and example. eos/examples holds XRs only:
# --ignore does not reach --examples-root.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: configuration-eos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install crossplane CLI
        run: |
          set -euo pipefail
          # install.sh otherwise takes whatever CLI is current.
          curl -sfL "https://cli.crossplane.io/install.sh" | XP_VERSION=v2.5.0 sh
          sudo mv ./crossplane /usr/local/bin/crossplane
          crossplane version --client

      - name: Build the package
        run: |
          set -euo pipefail
          crossplane xpkg build \
            --package-root=eos/apis \
            --examples-root=./eos/examples \
            -o configuration-eos-ci.xpkg

      # The git tag is the only version; the docs' install snippets keep ${VERSION}.
      - name: Check no pinned version in README or docs
        run: |
          set -euo pipefail
          if grep -rnE '(configuration-eos|configuration-iosxe|netclab-xp):v[0-9]' README.md docs/; then
            echo "::error::A package version is pinned above. The git tag is" \
                 "the version; leave the install snippet's \${VERSION}" \
                 "placeholder alone."
            exit 1
          fi

      # mkdocs --strict checks links, not commands: every directory a page names
      # after `-k` or `LoadRestrictionsNone` is built here, from the repository root.
      - name: Build the kustomizations the docs name
        run: |
          set -euo pipefail
          dirs=$(grep -rhoE '(-k|LoadRestrictionsNone) [^ ]+' docs/ | awk '{print $2}' | sort -u)
          test -n "$dirs"
          for d in $dirs; do
            echo "--- $d"
            kubectl kustomize --load-restrictor LoadRestrictionsNone "$d" > /dev/null
          done

      - uses: actions/upload-artifact@v7
        with:
          name: xpkg-ci
          path: configuration-eos-ci.xpkg
          if-no-files-found: error
          retention-days: 7

  # The tests render every example and check the compositions against the
  # router's answers recorded in iosxe/tests/fixtures/.
  iosxe:
    name: configuration-iosxe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: iosxe
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install crossplane CLI
        run: |
          set -euo pipefail
          curl -sfL "https://cli.crossplane.io/install.sh" | XP_VERSION=v2.5.0 sh
          sudo mv ./crossplane /usr/local/bin/crossplane
          crossplane version --client

      - name: Build the package
        run: |
          set -euo pipefail
          crossplane xpkg build \
            --package-root=apis \
            --examples-root=./examples \
            -o configuration-iosxe-ci.xpkg

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: iosxe/uv.lock

      - name: Ruff
        run: uvx ruff check && uvx ruff format --check

      - name: Tests
        run: uv run pytest
