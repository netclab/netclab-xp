name: Release configuration-aws-vpn

#   tag aws-vpn/v0.1.0  ->  function-aws-vpn:v0.1.0 (amd64, arm64)
#                           configuration-aws-vpn:v0.1.0
#                           both on ghcr.io/netclab and xpkg.upbound.io/netclab, with the
#                           icon on Upbound
#
# The tag is the only version, the same for both. The function goes first: the
# configuration depends on it on xpkg.upbound.io, so the Upbound push is not optional here.

on:
  push:
    tags: ['aws-vpn/v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  XP_VERSION: v2.5.0

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve the version to publish
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "::error::${{ github.ref_name }} is a ${{ github.ref_type }}, not a tag." \
                 "The tag is the version; dispatch this workflow against a tag."
            exit 1
          fi

          version="${{ github.ref_name }}"
          version="${version#aws-vpn/}"
          if ! [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${{ github.ref_name }}' is not aws-vpn/<semver>; xpkg push would reject it."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publishing ${version}"

  function:
    name: function-aws-vpn (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install crossplane CLI
        run: |
          set -euo pipefail
          curl -sfL "https://cli.crossplane.io/install.sh" | sh
          sudo mv ./crossplane /usr/local/bin/crossplane
          crossplane version --client

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: aws-vpn
          load: true
          tags: function-aws-vpn-runtime
          provenance: false
          cache-from: type=gha,scope=aws-vpn-${{ matrix.arch }}

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: aws-vpn/uv.lock

      # The image pushed is the image tested.
      - name: Tests, the function served from the image
        working-directory: aws-vpn
        env:
          FUNCTION_IMAGE: function-aws-vpn-runtime
        run: uv run pytest

      - name: Build the package
        run: |
          set -euo pipefail
          crossplane xpkg build \
            --package-root=aws-vpn/package \
            --embed-runtime-image=function-aws-vpn-runtime \
            -o "function-aws-vpn-${{ matrix.arch }}.xpkg"

      - uses: actions/upload-artifact@v7
        with:
          name: function-${{ matrix.arch }}
          path: function-aws-vpn-${{ matrix.arch }}.xpkg
          if-no-files-found: error
          retention-days: 7

  configuration:
    name: configuration-aws-vpn
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install crossplane CLI
        run: |
          set -euo pipefail
          curl -sfL "https://cli.crossplane.io/install.sh" | sh
          sudo mv ./crossplane /usr/local/bin/crossplane
          crossplane version --client

      - name: Build the package
        run: |
          set -euo pipefail
          crossplane xpkg build \
            --package-root=aws-vpn/apis \
            --examples-root=./aws-vpn/examples \
            -o configuration-aws-vpn.xpkg

      - name: Lay out the package extensions
        run: install -D docs/assets/icon.svg extensions/icons/icon.svg

      - uses: actions/upload-artifact@v7
        with:
          name: configuration
          path: |
            configuration-aws-vpn.xpkg
            extensions/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: push to GHCR + Upbound
    needs: [version, function, configuration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Install crossplane CLI
        run: |
          set -euo pipefail
          curl -sfL "https://cli.crossplane.io/install.sh" | sh
          sudo mv ./crossplane /usr/local/bin/crossplane

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to the Upbound registry
        uses: docker/login-action@v4
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.UPBOUND_USER }}
          password: ${{ secrets.UPBOUND_TOKEN }}

      - name: Push the function
        run: |
          set -euo pipefail
          for registry in ghcr.io xpkg.upbound.io; do
            crossplane xpkg push \
              -f function-aws-vpn-amd64.xpkg,function-aws-vpn-arm64.xpkg \
              "${registry}/netclab/function-aws-vpn:${VERSION}"
          done

      - name: Push the configuration
        run: |
          set -euo pipefail
          for registry in ghcr.io xpkg.upbound.io; do
            crossplane xpkg push -f configuration-aws-vpn.xpkg \
              "${registry}/netclab/configuration-aws-vpn:${VERSION}"
          done

      - name: Install up CLI
        run: |
          set -euo pipefail
          curl -sfL "https://cli.upbound.io" | VERSION=v0.56.0 sh
          sudo mv ./up /usr/local/bin/up

      - name: Append the icon on Upbound
        run: |
          set -euo pipefail
          for package in function-aws-vpn configuration-aws-vpn; do
            up xpkg append --extensions-root=extensions \
              "xpkg.upbound.io/netclab/${package}:${VERSION}"
          done
